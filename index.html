<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>我的持仓追踪</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#f85149;
  --blue:#58a6ff;--yellow:#d29922;--purple:#bc8cff;--accent:#1f6feb;--orange:#f0883e;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh}
#pbar{height:2px;background:var(--blue);position:fixed;top:0;left:0;z-index:9999;width:0%;transition:width .15s}

/* Header */
.hd{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hd-left{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#1f6feb,#58a6ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.hd-title{font-size:16px;font-weight:700}
.hd-sub{font-size:11px;color:var(--muted)}
.hd-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Period tabs */
.period-tabs{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:3px;gap:2px}
.ptab{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;padding:4px 12px;border-radius:5px;transition:.15s;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.active{background:var(--accent);color:#fff}

/* Buttons */
.btn{border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#388bfd}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-snap{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.btn-snap:hover{background:rgba(63,185,80,.22)}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-del{background:rgba(248,81,73,.12);color:var(--red);border:none}
.btn-del:hover{background:rgba(248,81,73,.22)}

/* Wrap */
.wrap{padding:16px 20px;max-width:1360px;margin:0 auto}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
.sc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.sc-val{font-size:18px;font-weight:700}
.sc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--blue)}

/* Update bar */
.upd-bar{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:7px 12px;font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.live{color:var(--green);font-weight:600}
.offline{color:var(--yellow)}
.snap-hint{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(210,153,34,.12);color:var(--yellow);border:1px solid rgba(210,153,34,.3)}

/* Filter bars */
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.fpill{padding:4px 11px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s}
.fpill-mkt{font-size:11px;padding:3px 10px;background:transparent;border:1px solid var(--border);color:var(--muted)}
.fpill-mkt.active{border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.08)}

/* Section */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.sec-title::before{content:'';display:inline-block;width:3px;height:14px;background:var(--blue);border-radius:2px}

/* Holdings grid */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px;margin-bottom:18px}
.hcard{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px;transition:all .18s;position:relative;overflow:hidden}
.hcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.hcard.pos::before{background:var(--green)}
.hcard.neg::before{background:var(--red)}
.hcard.flat::before{background:var(--muted)}
.hcard:hover{border-color:var(--blue);transform:translateY(-1px)}
.hcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hcard-name{font-size:14px;font-weight:700}
.hcard-meta{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.ttag{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.mktag{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:800}
.mktag-A{background:rgba(88,166,255,.15);color:var(--blue)}
.mktag-HK{background:rgba(240,136,62,.15);color:var(--orange)}
.mktag-US{background:rgba(188,140,255,.15);color:var(--purple)}
.hcard-r{text-align:right;flex-shrink:0}
.hcard-pct{font-size:15px;font-weight:700}
.hcard-price{font-size:11px;color:var(--muted);margin-top:2px}
.hcard-day{font-size:10px;margin-top:1px}
.hbar-wrap{background:var(--border);height:3px;border-radius:2px;margin:8px 0 6px}
.hbar{height:3px;border-radius:2px;background:var(--blue)}
.hcard-bot{display:flex;justify-content:space-between;align-items:center}
.hcard-detail{font-size:11px;color:var(--muted)}
.hcard-detail b{color:var(--text)}
.hcard-acts{display:flex;gap:3px;opacity:0;transition:.15s}
.hcard:hover .hcard-acts{opacity:1}
.no-snap-note{font-size:10px;color:var(--yellow)}

/* Market toggle in modal */
.mkt-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.mkt-btn{flex:1;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;padding:8px 4px;transition:.15s;text-align:center}
.mkt-btn:not(:last-child){border-right:1px solid var(--border)}
.mkt-btn.active{background:var(--accent);color:#fff}

/* Charts */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
.cc.full{grid-column:1/-1}
.cc-title{font-size:13px;font-weight:600;margin-bottom:1px}
.cc-sub{font-size:11px;color:var(--muted);margin-bottom:8px}

/* Table */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px;margin-bottom:18px;overflow-x:auto}
.tbl-wrap h3{font-size:13px;font-weight:700;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
th{text-align:left;padding:6px 8px;color:var(--muted);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid rgba(48,54,61,.4);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(88,166,255,.025)}
.chg-p{color:var(--green);font-weight:600}
.chg-n{color:var(--red);font-weight:600}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:15px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
label{font-size:11px;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 10px;font-size:13px;width:100%;outline:none;font-family:inherit;transition:.15s}
input:focus{border-color:var(--accent)}
input[list]{cursor:text}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text);margin-bottom:6px}
.empty p{font-size:12px;line-height:1.6;margin-bottom:16px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#21262d;border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13px;z-index:9999;transition:transform .25s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

.fill-loading{font-size:10px;color:var(--muted);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}

/* Auth overlay */
.auth-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:9000;align-items:center;justify-content:center;padding:20px}
.auth-overlay.show{display:flex}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:30px;width:100%;max-width:380px}
.auth-logo{width:52px;height:52px;background:linear-gradient(135deg,#1f6feb,#58a6ff);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto 14px}
.auth-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:22px}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:20px}
.auth-tab{flex:1;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;padding:9px;transition:.15s}
.auth-tab.active{background:var(--accent);color:#fff}
.auth-fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.auth-fg label{font-size:11px;color:var(--muted)}
.auth-fg input{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 12px;font-size:14px;outline:none;width:100%;transition:.15s;font-family:inherit}
.auth-fg input:focus{border-color:var(--accent)}
.auth-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;transition:.15s}
.auth-btn:hover{background:#388bfd}
.auth-err{color:var(--red);font-size:12px;min-height:18px;margin-top:8px;text-align:center}
/* User chip */
.user-chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-size:12px}
.user-chip-name{color:var(--text);font-weight:600}
.user-chip-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0;transition:.15s}
.user-chip-btn:hover{color:var(--red)}
.user-chip-admin{color:var(--yellow)!important}
.user-chip-admin:hover{color:var(--orange)!important}

@media(max-width:680px){
  .chart-row{grid-template-columns:1fr}
  .cc.full{grid-column:1}
  .stats{grid-template-columns:1fr 1fr}
  .frow{grid-template-columns:1fr}
  .hd{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<!-- Auth overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <div class="auth-logo">我</div>
    <div class="auth-title">持仓追踪</div>
    <div class="auth-sub">个人投资组合管理系统</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabLogin" onclick="authSwitchTab('login')">登录</button>
      <button class="auth-tab" id="authTabReg" onclick="authSwitchTab('register')">注册</button>
    </div>
    <div id="authLoginForm">
      <div class="auth-fg"><label>用户名</label><input id="al-user" placeholder="输入用户名" autocomplete="username"/></div>
      <div class="auth-fg"><label>密码</label><input id="al-pass" type="password" placeholder="输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="auth-btn" onclick="doLogin()">登录</button>
    </div>
    <div id="authRegForm" style="display:none">
      <div class="auth-fg"><label>邀请码</label><input id="ar-code" placeholder="请输入邀请码" autocomplete="off" oninput="this.value=this.value.toUpperCase()"/></div>
      <div class="auth-fg"><label>用户名</label><input id="ar-user" placeholder="2-20 个字符" autocomplete="username"/></div>
      <div class="auth-fg"><label>密码</label><input id="ar-pass" type="password" placeholder="至少 6 位" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()"/></div>
      <button class="auth-btn" onclick="doRegister()">注册</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- Admin overlay -->
<div class="overlay" id="adminOverlay">
  <div class="modal" style="max-width:420px">
    <h2>管理员面板</h2>
    <div class="modal-sub">生成邀请码后发送给用户</div>
    <div id="adminUserList" style="margin-bottom:16px;font-size:12px;max-height:180px;overflow-y:auto"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="genInvite()">生成邀请码</button>
      <span id="inviteResult" style="font-family:monospace;font-size:15px;font-weight:700;color:var(--green);letter-spacing:2px"></span>
    </div>
    <div class="mbtns" style="margin-top:16px">
      <button class="btn btn-ghost" onclick="document.getElementById('adminOverlay').classList.remove('show')">关闭</button>
    </div>
  </div>
</div>

<div id="pbar"></div>

<div class="hd">
  <div class="hd-left">
    <div class="logo">我</div>
    <div>
      <div class="hd-title">我的持仓追踪</div>
      <div class="hd-sub" id="hdSub">个人账户 · 多市场持仓</div>
    </div>
  </div>
  <div class="hd-right">
    <div class="period-tabs">
      <button class="ptab active" onclick="setPeriod('hold',this)">持有</button>
      <button class="ptab" onclick="setPeriod('day',this)">今日</button>
      <button class="ptab" onclick="setPeriod('month',this)">本月</button>
      <button class="ptab" onclick="setPeriod('year',this)">本年</button>
    </div>
    <button class="btn btn-snap" onclick="saveSnapshot()">📌 存快照</button>
    <button class="btn btn-primary" onclick="openAdd()">+ 添加持仓</button>
    <div class="user-chip" id="userChip" style="display:none">
      <span class="user-chip-name" id="userChipName"></span>
      <button class="user-chip-btn user-chip-admin" id="adminBtn" onclick="openAdmin()" title="管理员" style="display:none">⚙</button>
      <button class="user-chip-btn" onclick="doLogout()" title="退出登录">退出</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="upd-bar">
    <span>行情：<span id="quoteSrc" class="offline">○ 未获取</span> · 更新：<span id="updTime">—</span></span>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="fxRateInfo" style="font-size:11px;color:var(--muted)"></span>
      <span id="snapHint" class="snap-hint" style="display:none"></span>
      <button class="btn btn-ghost btn-sm" onclick="doRefresh()">↻ 刷新行情</button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="filter-row" id="mktBar"></div>
  <div class="filter-row" id="themeBar"></div>

  <div class="sec-hd">
    <div class="sec-title">持仓明细</div>
    <div style="font-size:12px;color:var(--muted)" id="holdMeta"></div>
  </div>
  <div class="hgrid" id="holdGrid"></div>

  <div class="chart-row">
    <div class="cc">
      <div class="cc-title">题材分布</div>
      <div class="cc-sub">按市值占比（折合人民币）</div>
      <div id="themeChart" style="height:260px"></div>
    </div>
    <div class="cc">
      <div class="cc-title">持仓盈亏</div>
      <div class="cc-sub" id="pnlChartSub">各股收益率（%）</div>
      <div id="pnlChart" style="height:260px"></div>
    </div>
    <div class="cc full">
      <div class="cc-title">月度收益走势</div>
      <div class="cc-sub">历史月收益率（每月末点击「存快照」记录一次）</div>
      <div id="monthChart" style="height:200px"></div>
    </div>
  </div>

  <div class="tbl-wrap">
    <h3 id="tblTitle">持仓明细表</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th class="sortable" onclick="sortBy('name')">名称<span id="sort-name"></span></th>
          <th class="sortable" onclick="sortBy('code')">代码<span id="sort-code"></span></th>
          <th>市场</th><th>题材</th>
          <th class="sortable" onclick="sortBy('shares')">持股<span id="sort-shares"></span></th>
          <th class="sortable" onclick="sortBy('cost')">成本<span id="sort-cost"></span></th>
          <th class="sortable" onclick="sortBy('price')">现价<span id="sort-price"></span></th>
          <th id="th-pnl" class="sortable" onclick="sortBy('pnl')">浮盈亏<span id="sort-pnl"></span></th>
          <th id="th-pct" class="sortable" onclick="sortBy('pct')">收益率<span id="sort-pct"></span></th>
          <th class="sortable" onclick="sortBy('day')">今日<span id="sort-day"></span></th>
          <th class="sortable" onclick="sortBy('wt')">占比<span id="sort-wt"></span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tblBody"></tbody>
    </table>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="overlay" id="posOverlay">
  <div class="modal">
    <h2 id="posTitle">添加持仓</h2>
    <div class="modal-sub" id="posSub">支持A股、港股、美股</div>
    <div class="frow">
      <div class="fg full">
        <label>市场</label>
        <div class="mkt-toggle">
          <button class="mkt-btn active" data-mkt="A" onclick="setMkt(this)">🇨🇳 A股</button>
          <button class="mkt-btn" data-mkt="HK" onclick="setMkt(this)">🇭🇰 港股</button>
          <button class="mkt-btn" data-mkt="US" onclick="setMkt(this)">🇺🇸 美股</button>
        </div>
      </div>
      <div class="fg">
        <label id="codeLabel">股票代码 <span id="fillBadge" class="fill-loading"></span></label>
        <input id="f-code" placeholder="如：002463" oninput="onCodeInput()" onblur="onCodeBlur()"/>
      </div>
      <div class="fg">
        <label>股票名称</label>
        <input id="f-name" placeholder="如：沪电股份"/>
      </div>
      <div class="fg full">
        <label>题材 / 主题（可自由输入）</label>
        <input id="f-theme" list="themeList" placeholder="选择预设或直接输入新题材"/>
        <datalist id="themeList"></datalist>
      </div>
      <div class="fg">
        <label>持股数量（股/份）</label>
        <input id="f-shares" type="number" placeholder="如：10000" min="1"/>
      </div>
      <div class="fg">
        <label>持仓成本价</label>
        <input id="f-cost" type="number" placeholder="如：5.20" step="0.001" min="0.001"/>
      </div>
      <div class="fg">
        <label>买入日期（选填）</label>
        <input id="f-buyDate" type="date"/>
      </div>
      <div class="fg">
        <label>备注（选填）</label>
        <input id="f-note" placeholder="如：网格 / 长线"/>
      </div>
    </div>
    <div class="mbtns">
      <button class="btn btn-ghost" onclick="closePosModal()">取消</button>
      <button class="btn btn-primary" onclick="savePos()">保存</button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="overlay" id="delOverlay">
  <div class="modal" style="max-width:320px">
    <h2>确认删除</h2>
    <div class="modal-sub" id="delMsg" style="margin-top:8px"></div>
    <div class="mbtns">
      <button class="btn btn-ghost" onclick="closeDelModal()">取消</button>
      <button class="btn btn-del" onclick="doDelete()">删除</button>
    </div>
  </div>
</div>

// ─── Auth ──────────────────────────────────────────────────
function getToken()        { return localStorage.getItem('auth_token') || ''; }
function setToken(t)       { localStorage.setItem('auth_token', t); }
function clearToken()      { localStorage.removeItem('auth_token'); localStorage.removeItem('auth_user'); localStorage.removeItem('auth_admin'); }
function getStoredUser()   { return localStorage.getItem('auth_user') || ''; }
function setStoredUser(u, admin) { localStorage.setItem('auth_user', u); localStorage.setItem('auth_admin', admin ? '1' : ''); }
function isStoredAdmin()   { return !!localStorage.getItem('auth_admin'); }

function authFetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + getToken();
  return fetch(url, opts).then(function(r) {
    if (r.status === 401) { clearToken(); showAuth(); throw new Error('unauthorized'); }
    return r;
  });
}

function showAuth() {
  document.getElementById('authOverlay').classList.add('show');

// ─── FX 换算（启动时从服务器获取最新汇率） ───
let FX = { CNY:1, HKD:0.92, USD:7.25 };
function mktCurrency(mkt) { return mkt==='US'?'USD':mkt==='HK'?'HKD':'CNY'; }
function toCNY(amount, mkt) { return amount * (FX[mktCurrency(mkt)] || 1); }
function fmtAmt(amount, mkt) {
  const abs = Math.abs(amount);
  const s = abs.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  if (mkt === 'US') return '$' + s;
  if (mkt === 'HK') return 'HK$' + s;
  return '¥' + s;
}
function fmtAmtCNY(amount) {
  const abs = Math.abs(amount);
  return '¥' + abs.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
// 单行 CNY 价格（用于持仓卡片）
function fmtPx(price, mkt) {
  if (price == null) return '—';
  if (mkt === 'A') return '¥' + price.toFixed(3);
  return '¥' + toCNY(price, mkt).toFixed(2);
}
// 双行价格：CNY 为主 + 原币小字（用于详情表格）
function fmtPxFull(price, mkt) {
  if (price == null) return '—';
  if (mkt === 'A') return '¥' + price.toFixed(3);
  const cny  = toCNY(price, mkt);
  const orig = mkt === 'US' ? '$' + price.toFixed(2) : 'HK$' + price.toFixed(3);
  return `¥${cny.toFixed(2)}<span style="font-size:10px;color:var(--muted);margin-left:3px">${orig}</span>`;
}
// 盘前/盘后价格 HTML（仅美股）
function prePostHtml(p, forCard) {
  if (p.mkt !== 'US' || (!p.preMarketPrice && !p.postMarketPrice)) return '';
  const ms = p.marketState || '';
  let price, pct, label, color;
  if (p.preMarketPrice && (ms === 'PRE' || !p.postMarketPrice)) {
    price = p.preMarketPrice; pct = p.preMarketChangePct; label = '盘前'; color = '#f0ad4e';
  } else {
    price = p.postMarketPrice; pct = p.postMarketChangePct; label = '盘后'; color = 'var(--purple)';
  }
  const cnyStr = '≈¥' + toCNY(price, 'US').toFixed(2);
  const sign   = (pct || 0) >= 0 ? '+' : '';
  const txt    = `${label} $${price.toFixed(2)}${cnyStr} (${sign}${(pct||0).toFixed(2)}%)`;
  return forCard
    ? `<div style="font-size:10px;color:${color}">${txt}</div>`
    : `<br><span style="font-size:10px;color:${color}">${txt}</span>`;
}

// ─── 工具 ───
function todayYM() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function addM(ym, n) {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function ymLabel(ym) {
  const [y,m] = ym.split('-');
  return y + '年' + parseInt(m) + '月';

function pSign(v) { return v >= 0 ? '+' : ''; }
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// ─── 数据迁移 v2→v3 ───
function migrate(data) {
  if (!data) return { v:3, positions:[], snapshots:{}, customThemes:[] };
  if (data.v === 3) return data;
  // v2: months[ym].positions[]
  const byId = {};
  const months = Object.keys(data.months || {}).sort();
  months.forEach(ym => {
    (data.months[ym]?.positions || []).forEach(p => {
      const prev = byId[p.id];
      byId[p.id] = { ...p, market:'A', buyDate: prev ? prev.buyDate : ym+'-01' };
    });
  });
  // migrate old snapshots: { ym: { value, date } } → keep as-is, prices will be empty
  const snaps = {};
  Object.entries(data.snapshots || {}).forEach(([ym, s]) => {
    snaps[ym] = { date: s.date, total: s.value || 0, prices: {} };
  });
  return { v:3, positions: Object.values(byId), snapshots: snaps, customThemes:[] };
}

// ─── 行情 ───
function toTxSym(code) {
  if (code.startsWith('6') || code.startsWith('5')) return 'sh' + code;
  if (code.startsWith('8') || code.startsWith('9') || code.startsWith('4')) return 'bj' + code;
  return 'sz' + code;
}
async function fetchLiveA(codes) {
  if (!codes.length) return {};
  try {
    const r = await fetch('https://qt.gtimg.cn/q=' + codes.map(toTxSym).join(','), {cache:'no-store'});
    const txt = await r.text();
    const res = {};
    txt.split('\n').forEach(line => {
      const m = line.match(/v_([a-z]{2})(\d+)="([^"]+)"/);
      if (!m) return;
      const parts = m[3].split('~');
      if (parts.length < 5) return;
      const price = parseFloat(parts[3]), prev = parseFloat(parts[4]);
      if (price > 0) res[m[2]] = { price, prev, chg: prev>0 ? +((price-prev)/prev*100).toFixed(2) : 0, src:'live' };
    });
    return res;
  } catch { return {}; }
}
async function fetchServerPrices(symbols) {
  if (!symbols.length) return {};
  try {
    const r = await authFetch('/api/prices?symbols=' + encodeURIComponent(symbols.join(',')), {cache:'no-store'});
    const data = await r.json();
    const res = {};
    Object.entries(data).forEach(([sym, d]) => {
      if (d && d.price) {
        res[sym] = {
          price: d.price, prev: d.prev||d.price, chg: +(d.changePct||0).toFixed(2), src:'live', currency: d.currency,
          marketState:     d.marketState     || 'REGULAR',
          preMarketPrice:  d.preMarketPrice  || null,
          preMarketChangePct: d.preMarketChangePct || null,
          postMarketPrice: d.postMarketPrice || null,
          postMarketChangePct: d.postMarketChangePct || null,
        };
      }
    });
    return res;
  } catch { return {}; }
}

// qCache key per position
function qKey(p) {
  if (!p.market || p.market === 'A') return p.code;
  if (p.market === 'HK') return p.code.padStart(4,'0') + '.HK';
  return p.code.toUpperCase();
}
function getQ(p) {
  return qCache[qKey(p)] || { price: FALLBACK_A[p.code]||50, prev: FALLBACK_A[p.code]||50, chg:0, src:'fallback' };
}

// ─── 快照 ───
function saveSnapshot() {
  const positions = portfolio.positions || [];
  if (!positions.length) { toast('没有持仓数据'); return; }
  const prices = {};
  let total = 0;
  positions.forEach(p => {
    const q = getQ(p);
    prices[p.id] = q.price;
    total += toCNY(q.price * p.shares, p.market);
  });
  const ym = todayYM();
  if (!portfolio.snapshots) portfolio.snapshots = {};
  portfolio.snapshots[ym] = { date: new Date().toLocaleDateString('zh-CN'), total, prices };
  saveToServer().then(()=>{ toast(`已记录 ${ymLabel(ym)} 快照`); render(); });
}

// ─── 收益计算 ───
function snapPricesFor(period) {
  const snaps = portfolio.snapshots || {};
  if (period === 'month') return snaps[addM(todayYM(),-1)]?.prices || null;
  if (period === 'year') return snaps[(new Date().getFullYear()-1)+'-12']?.prices || null;
  return null;
}
function snapTotalFor(period) {
  const snaps = portfolio.snapshots || {};
  if (period === 'month') { const s=snaps[addM(todayYM(),-1)]; return s?s.total:null; }
  if (period === 'year') { const s=snaps[(new Date().getFullYear()-1)+'-12']; return s?s.total:null; }
  return null;
}
function posReturn(p, period) {
  const q = getQ(p);
  if (period === 'day') {
    const pct = q.chg || 0;
    const pnl = (q.prev || q.price) * p.shares * pct / 100;
    return { pct, pnl, ok:true };
  }
  if (period === 'hold') {
    const pnl = (q.price - p.avgCost) * p.shares;
    const pct = p.avgCost > 0 ? (q.price - p.avgCost) / p.avgCost * 100 : 0;
    return { pct, pnl, ok:true };
  }
  const prices = snapPricesFor(period);
  if (!prices || prices[p.id] == null) {
    // fallback: show hold return, mark as no-snap
    const pnl = (q.price - p.avgCost) * p.shares;
    const pct = p.avgCost > 0 ? (q.price - p.avgCost) / p.avgCost * 100 : 0;
    return { pct, pnl, ok:false, noSnap:true };
  }
  const sp = prices[p.id];
  const pnl = (q.price - sp) * p.shares;
  const pct = sp > 0 ? (q.price - sp) / sp * 100 : 0;
  return { pct, pnl, ok:true };
}

// ─── Period tab ───
function setPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll('.ptab').forEach(el=>el.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ─── 主渲染 ───
function render() {
  const period = currentPeriod;
  const positions = portfolio.positions || [];

  // enrich
  let totalValCNY = 0, totalCostCNY = 0;
  const enriched = positions.map(p => {
    const q = getQ(p);
    const mkt = p.market || 'A';
    const val = q.price * p.shares;
    const cost = p.avgCost * p.shares;
    const valCNY = toCNY(val, mkt);
    const costCNY = toCNY(cost, mkt);
    totalValCNY += valCNY;
    totalCostCNY += costCNY;
    const ret = posReturn(p, period);
    const dayRet = period === 'day' ? ret : posReturn(p, 'day');
    return { ...p, ...q, mkt, val, cost, valCNY, costCNY, ret, dayRet };
  });

  const holdPnlCNY = totalValCNY - totalCostCNY;
  const holdPct = totalCostCNY > 0 ? holdPnlCNY / totalCostCNY * 100 : 0;
  const hasMultiCcy = enriched.some(p=>p.mkt==='HK'||p.mkt==='US');

  // period-level P&L
  let periodPnlCNY = null, periodPct = null;
  if (period === 'hold') {
    periodPnlCNY = holdPnlCNY; periodPct = holdPct;
  } else if (period === 'day') {
    periodPnlCNY = enriched.reduce((s,p)=>s+toCNY(p.dayRet.pnl,p.mkt),0);
    const prevTot = enriched.reduce((s,p)=>s+toCNY((p.prev||p.price)*p.shares,p.mkt),0);
    periodPct = prevTot > 0 ? periodPnlCNY/prevTot*100 : 0;
  } else {
    const snapTot = snapTotalFor(period);
    if (snapTot != null) {
      // use actual snapshot total (more accurate than per-position sum)
      periodPnlCNY = totalValCNY - snapTot;
      periodPct = snapTot > 0 ? periodPnlCNY/snapTot*100 : 0;
    }
  }

  // header hint
  document.getElementById('hdSub').textContent = '个人账户 · ' + PERIOD_LABEL[period] + '收益视图';

  // snapshot hint for month/year
  const hintEl = document.getElementById('snapHint');
  if ((period==='month'||period==='year') && periodPnlCNY===null) {
    const needYm = period==='month' ? addM(todayYM(),-1) : (new Date().getFullYear()-1)+'-12';
    hintEl.textContent = '需要 ' + ymLabel(needYm) + ' 快照';
    hintEl.style.display = '';
  } else {
    hintEl.style.display = 'none';
  }

  // table headers
  document.getElementById('th-pnl').innerHTML = PERIOD_LABEL[period] + '盈亏<span id="sort-pnl"></span>';
  document.getElementById('th-pct').innerHTML = PERIOD_LABEL[period] + '收益率<span id="sort-pct"></span>';
  document.getElementById('pnlChartSub').textContent = '各股' + PERIOD_LABEL[period] + '收益率（%）';
  document.getElementById('tblTitle').textContent = '持仓明细 · ' + PERIOD_LABEL[period] + '视图';

  renderStats(enriched, totalValCNY, totalCostCNY, holdPnlCNY, holdPct, periodPnlCNY, periodPct, hasMultiCcy, period);
  renderMktBar(enriched);
  renderThemeBar(enriched);
  renderGrid(enriched, totalValCNY, period);
  renderTable(enriched, totalValCNY, period);
  try { renderCharts(enriched, totalValCNY, period); } catch(e) { console.warn(e); }
}

function sc(lbl, val, cls, sub) {
  return `<div class="sc"><div class="sc-lbl">${lbl}</div><div class="sc-val ${cls}">${val}</div><div class="sc-sub">${sub}</div></div>`;
}
function renderStats(enriched, totalValCNY, totalCostCNY, holdPnlCNY, holdPct, periodPnlCNY, periodPct, hasMultiCcy, period) {
  const cnt = enriched.length;
  const mktC = {A:0,HK:0,US:0};

  const mktStr = [mktC.A&&`A×${mktC.A}`,mktC.HK&&`港×${mktC.HK}`,mktC.US&&`美×${mktC.US}`].filter(Boolean).join(' ');

  let periodCard;
  if (periodPnlCNY !== null) {
    const sign = periodPnlCNY >= 0 ? '+' : '-';
    periodCard = sc(PERIOD_LABEL[period]+'收益',
      pSign(periodPct)+periodPct.toFixed(2)+'%',
      periodPct>=0?'pos':'neg',
      sign+fmtAmtCNY(periodPnlCNY));
  } else {
    periodCard = sc(PERIOD_LABEL[period]+'收益','—','neu','需记录快照');
  }

  const approxLabel = hasMultiCcy ? '约' : '';
  document.getElementById('statsRow').innerHTML =
    sc('持仓市值', approxLabel+fmtAmtCNY(totalValCNY), 'neu', cnt+'支'+( hasMultiCcy?' (折合)':'')) +

    sc('持有浮盈', pSign(holdPct)+holdPct.toFixed(2)+'%', holdPnlCNY>=0?'pos':'neg',
      (holdPnlCNY>=0?'+':'-')+fmtAmtCNY(holdPnlCNY)) +
    periodCard +
    sc('持仓支数', String(cnt), 'neu', mktStr||'暂无持仓');
}

function renderCharts(enriched, totalValCNY, period) {
  let list = enriched;

  // Theme pie

    list.forEach(p=>{const t=p.theme||'其他';tm[t]=(tm[t]||0)+p.valCNY;});
    charts.theme.setOption({
      backgroundColor:'#161b22',
      tooltip:{trigger:'item',formatter:'{b}: ¥{c} ({d}%)',backgroundColor:'#1c2128',borderColor:'#30363d',textStyle:{color:'#e6edf3',fontSize:12}},
      legend:{show:false},
      series:[{type:'pie',radius:['36%','68%'],itemStyle:{borderColor:'#161b22',borderWidth:2},
        label:{formatter:'{b}\n{d}%',fontSize:11,color:'#8b949e'},
        data:Object.entries(tm).map(([name,val])=>({name,value:+val.toFixed(0),itemStyle:{color:themeColor(name)}}))}]
    });
  }

  // P&L bar
  const pnlEl=document.getElementById('pnlChart');
  if(pnlEl){ if(charts.pnl)charts.pnl.dispose(); charts.pnl=echarts.init(pnlEl,'dark');
    const sorted=[...list].sort((a,b)=>(b.ret.pct||0)-(a.ret.pct||0));
    charts.pnl.setOption({
      backgroundColor:'#161b22',
      tooltip:{trigger:'axis',backgroundColor:'#1c2128',borderColor:'#30363d',textStyle:{color:'#e6edf3',fontSize:12}},
      grid:{left:70,right:55,top:6,bottom:26},
      xAxis:{axisLabel:{color:'#8b949e',fontSize:10,formatter:v=>v+'%'},splitLine:{lineStyle:{color:'#21262d'}}},
      yAxis:{type:'category',data:sorted.map(p=>p.name),axisLabel:{color:'#8b949e',fontSize:11}},
      series:[{type:'bar',
        data:sorted.map(p=>({value:+(p.ret.pct||0).toFixed(2),itemStyle:{color:(p.ret.pct||0)>=0?'#3fb950':'#f85149'}})),
        label:{show:true,position:'right',formatter:p=>(p.value>=0?'+':'')+p.value+'%',fontSize:10,color:'#e6edf3'},
        barMaxWidth:14}]
    });
  }

  // Monthly trend
  const mEl=document.getElementById('monthChart');
  if(mEl){ if(charts.month)charts.month.dispose(); charts.month=echarts.init(mEl,'dark');
    const months=[]; for(let i=11;i>=0;i--)months.push(addM(todayYM(),-i));
    const snaps=portfolio.snapshots||{};
    const retData=months.map((ym,idx)=>{
      if(idx===0)return null;
      const prev=months[idx-1];
      const a=snaps[ym],b=snaps[prev];
      if(!a||!b)return null;
      return +((a.total-b.total)/b.total*100).toFixed(2);
    });
    charts.month.setOption({
      backgroundColor:'#161b22',
      tooltip:{trigger:'axis',formatter:p=>{const v=p[0].value;return p[0].axisValue+'<br>'+(v!=null?(v>=0?'+':'')+v+'%':'无快照');},backgroundColor:'#1c2128',borderColor:'#30363d',textStyle:{color:'#e6edf3',fontSize:12}},
      grid:{left:46,right:14,top:14,bottom:26},
      xAxis:{data:months.map(m=>m.slice(5)+'月'),axisLabel:{color:'#8b949e',fontSize:10}},
      yAxis:{axisLabel:{color:'#8b949e',fontSize:10,formatter:v=>v+'%'},splitLine:{lineStyle:{color:'#21262d'}}},
      series:[{type:'bar',data:retData,
        itemStyle:{color:p=>p.value!=null?(p.value>=0?'#3fb950':'#f85149'):'#21262d'},
        label:{show:true,position:'top',formatter:p=>p.value!=null?(p.value>=0?'+':'')+p.value+'%':'',fontSize:10,color:'#e6edf3'},
        barMaxWidth:22}]
    });
  }

  // resize handler (debounced)
  if (!charts._resizeBound) {
    charts._resizeBound = true;
    window.addEventListener('resize', ()=>{
      charts.theme?.resize(); charts.pnl?.resize(); charts.month?.resize();
    });
  }
}

function setFillLoading(on) {
  let badge = document.getElementById('fillBadge');
  if (!badge) return;

async function fetchAndFill(code, market) {
  const nameEl  = document.getElementById('f-name');
  const themeEl = document.getElementById('f-theme');
  setFillLoading(true);
  try {
    if (market === 'A') {
      // A股名称：腾讯行情，用 GBK 解码避免乱码
      try {
        const sym = toTxSym(code);
        const r = await fetch('https://qt.gtimg.cn/q=' + sym, {cache:'no-store'});
        const buf = await r.arrayBuffer();
        const txt = new TextDecoder('gbk').decode(buf);
        const m = txt.match(/v_[a-z]{2}\d+="([^"]+)"/);
        if (m) {
          const parts = m[1].split('~');
          const name = parts[1];
          if (name && name !== code) { nameEl.value = name; nameEl.dataset.auto = '1'; }
        }
      } catch {}
      // 行业：Yahoo Finance（可能较慢，忽略失败）
      if (!themeEl.value) {
        try {
          const r = await authFetch('/api/stock-info?code='+encodeURIComponent(code)+'&market=A');
          const d = await r.json();
          if (d.industry) themeEl.value = d.industry;
        } catch {}
      }
    } else {
      // 港股/美股：先从行情接口取名字（最可靠），再尝试 stock-info 取行业
      try {
        const sym = market === 'HK' ? code.padStart(4,'0') + '.HK' : code.toUpperCase();
        const r = await authFetch('/api/prices?symbols=' + encodeURIComponent(sym));
        const d = await r.json();
        const info = d[sym];
        if (info && info.name && !nameEl.value) { nameEl.value = info.name; nameEl.dataset.auto = '1'; }
      } catch {}
      if (!themeEl.value) {
        try {
          const r = await authFetch('/api/stock-info?code='+encodeURIComponent(code)+'&market='+market);
          const d = await r.json();
          if (d.name && !nameEl.value) nameEl.value = d.name;
          if (d.industry) themeEl.value = d.industry;
        } catch {}
      }
    }
  } catch {}
  setFillLoading(false);
}

// ─── 美股交易时段检测 ───
function isUSMarketOpen() {
  const now = new Date();
  const day = now.getUTCDay();
  if (day === 0 || day === 6) return false;
  // Approximate DST: EDT (UTC-4) March–October, EST (UTC-5) otherwise
  const m = now.getUTCMonth();
  const etOffset = (m >= 2 && m <= 10) ? -4 : -5;
  const etMins = ((now.getUTCHours() + etOffset + 24) % 24) * 60 + now.getUTCMinutes();
  return etMins >= 570 && etMins < 960; // 9:30–16:00 ET
}

async function savePos() {
  const rawCode = document.getElementById('f-code').value.trim();
  const name   = document.getElementById('f-name').value.trim();
  const theme  = document.getElementById('f-theme').value.trim();
  const shares = parseInt(document.getElementById('f-shares').value);
  const cost   = parseFloat(document.getElementById('f-cost').value);
  const note   = document.getElementById('f-note').value.trim();
  const buyDate= document.getElementById('f-buyDate').value;
  const market = modalMkt;

  if(!rawCode||!name){toast('请填写股票代码和名称');return;}
  if(!shares||shares<=0){toast('持股数量无效');return;}
  if(!cost||cost<=0){toast('成本价无效');return;}

  // normalize code
  let code = rawCode;
  if(market==='HK') code = rawCode.replace(/^0+/,'') || rawCode; // strip leading zeros, store short form
  else if(market==='US') code = rawCode.toUpperCase();

  // register custom theme
  if(theme && !TC_BASE[theme] && !(portfolio.customThemes||[]).includes(theme)){
    if(!portfolio.customThemes)portfolio.customThemes=[];
    portfolio.customThemes.push(theme);
  }

  if(!portfolio.positions)portfolio.positions=[];
  const posData={code,name,market,theme,shares,avgCost:cost,note,buyDate};
  if(editingId){
    const idx=portfolio.positions.findIndex(p=>p.id===editingId);
    if(idx>=0)portfolio.positions[idx]={...portfolio.positions[idx],...posData};
  } else {
    portfolio.positions.push({id:uid(),...posData});
  }

  closePosModal();
  await saveToServer();

  // prefetch quote
  const sym = market==='HK'?code.padStart(4,'0')+'.HK':market==='US'?code.toUpperCase():code;
  if(!qCache[sym]){
    if(market==='A') fetchLiveA([code]).then(r=>{if(r[code]){qCache[code]=r[code];render();}});
    else fetchServerPrices([sym]).then(r=>{if(r[sym]){qCache[sym]=r[sym];render();}});
  }
  toast(editingId?'已更新':'已添加');
  render();
}

// ─── 删除 ───
function askDel(id){
  const p=(portfolio.positions||[]).find(x=>x.id===id);
  deletingId=id;
  document.getElementById('delMsg').textContent=`确定要删除「${p?.name||'该持仓'}」？`;
  document.getElementById('delOverlay').classList.add('show');
}
function closeDelModal(){deletingId=null;document.getElementById('delOverlay').classList.remove('show');}
async function doDelete(){
  if(!deletingId)return;
  portfolio.positions=(portfolio.positions||[]).filter(p=>p.id!==deletingId);
  closeDelModal();
  await saveToServer();
  toast('已删除');
  render();
}

// ─── 汇率 ───
async function loadExchangeRate() {
  try {
    const r = await authFetch('/api/exchange-rate', { cache: 'no-store' });
    const d = await r.json();
    if (d.USD > 1)   FX.USD = d.USD;
    if (d.HKD > 0.1) FX.HKD = d.HKD;
    const el = document.getElementById('fxRateInfo');
    if (el) el.textContent = `USD/CNY ${FX.USD.toFixed(4)} · HKD/CNY ${FX.HKD.toFixed(4)}`;
  } catch(e) {}
}

// ─── 初始化 ───
async function init(){
  progress(20);
  await loadFromServer();
  progress(40);
  await loadExchangeRate();
  progress(60);
  render();
  await doRefresh();
  progress(100);
}

// 启动时检查登录状态
(async function checkAuth() {
  const token = getToken();
  if (!token) { showAuth(); return; }
  try {
    const r = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) { clearToken(); showAuth(); return; }
    const d = await r.json();
    setStoredUser(d.username, d.isAdmin);
    hideAuth(d.username, d.isAdmin);
    await init();
  } catch { showAuth(); }
})();

setInterval(doRefresh, 10*60*1000);
setInterval(loadExchangeRate, 4*60*60*1000);
</script>
