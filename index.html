<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>持仓损益</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--surf:#161b22;--card:#21262d;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;
  --green:#3fb950;--red:#f85149;--blue:#58a6ff;--gold:#d29922;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
#pbar{height:2px;background:var(--blue);position:fixed;top:0;left:0;z-index:9999;transition:width .1s linear;width:0%}
/* Header */
.hdr{background:var(--surf);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:17px;font-weight:700;color:var(--blue)}
.hdr-right{display:flex;align-items:center;gap:10px}
.upd-time{color:var(--text2);font-size:11px}
.btn-ref{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;min-width:90px;transition:background .2s}
.btn-ref:hover{background:var(--border)}
.btn-ref:disabled{opacity:.6;cursor:default}
/* Summary */
.summ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:480px){.summ{grid-template-columns:repeat(2,1fr)}}
.sc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.sc-lbl{color:var(--text2);font-size:11px;margin-bottom:4px}
.sc-val{font-size:16px;font-weight:700}
.sc-val.pos{color:var(--green)}.sc-val.neg{color:var(--red)}
/* Content */
.content{padding:14px;max-width:1200px;margin:0 auto}
/* Account */
.acc{background:var(--surf);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.acc-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);flex-wrap:wrap;gap:8px}
.acc-name{background:transparent;border:none;color:var(--text);font-size:15px;font-weight:700;outline:none;cursor:text;max-width:200px;min-width:60px}
.acc-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acc-summ{font-size:12px;color:var(--text2)}
.ico-btn{background:var(--surf);border:1px solid var(--border);color:var(--text2);width:28px;height:28px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
.ico-btn:hover{background:var(--card);color:var(--text)}
.ico-btn.del:hover{background:#2d1b1b;color:var(--red);border-color:var(--red)}
/* Table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#0d1117;color:var(--text2);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;padding:7px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 12px;border-top:1px solid var(--border);text-align:right;white-space:nowrap;vertical-align:middle}
.tbl td:first-child{text-align:left}
.tbl tr:hover{background:rgba(255,255,255,.02)}
.sym-cell{display:flex;flex-direction:column;gap:2px}
.sym{font-weight:700;font-size:14px}
.sname{color:var(--text2);font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--text2)}
.price-chg{font-size:11px;display:block}
.err-price{color:var(--gold);font-size:11px}
/* Footer */
.acc-ft{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.btn-add-pos{background:transparent;border:1px dashed var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s}
.btn-add-pos:hover{border-color:var(--blue);color:var(--blue)}
/* Mobile cards */
@media(max-width:640px){
  .tbl{display:none}.mob-pos{display:block}
  .pcard{border-top:1px solid var(--border);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pcard-hdr{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start}
  .pf{display:flex;flex-direction:column;gap:2px}
  .pfl{font-size:10px;color:var(--text2)}
  .pfv{font-size:13px;font-weight:600}
}
@media(min-width:641px){.mob-pos{display:none}}
/* Add account */
.btn-add-acc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:transparent;border:2px dashed var(--border);border-radius:10px;color:var(--text2);font-size:14px;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-add-acc:hover{border-color:var(--blue);color:var(--blue)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:22px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:14px}
.fl{display:block;color:var(--text2);font-size:12px;margin-bottom:5px}
.fi{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:6px;font-size:14px;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--blue)}
.fhint{color:var(--text2);font-size:11px;margin-top:4px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-pri{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:opacity .2s}
.btn-pri:hover{opacity:.85}
.btn-sec{background:var(--card);color:var(--text);border:1px solid var(--border);padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;transition:background .2s}
.btn-sec:hover{background:var(--border)}
/* Confirm */
.conf-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px}
.conf{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:22px;max-width:310px;width:100%;text-align:center}
.conf p{color:var(--text2);margin:8px 0 16px;font-size:13px}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
.empty{padding:32px;text-align:center;color:var(--text2);font-size:13px}
</style>
</head>
<body>
<div id="pbar"></div>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">&#128200; 持仓损益追踪器</div>
      <div class="hdr-right">
        <span class="upd-time" id="updTime">--</span>
        <button class="btn-ref" id="refBtn" onclick="manualRefresh()">刷新行情</button>
      </div>
    </div>
    <div class="summ">
      <div class="sc"><div class="sc-lbl">总市值</div><div class="sc-val" id="sTotalVal">--</div></div>
      <div class="sc"><div class="sc-lbl">总盈亏额</div><div class="sc-val" id="sTotalPnl">--</div></div>
      <div class="sc"><div class="sc-lbl">总盈亏%</div><div class="sc-val" id="sTotalPct">--</div></div>
    </div>
  </div>
  <div class="content">
    <div id="accs"></div>
    <button class="btn-add-acc" onclick="addAccount()">&#65291; 新增账户</button>
  </div>
</div>

<!-- Position Modal -->
<div class="modal-bg" id="posMdl" style="display:none">
  <div class="modal">
    <h2 id="mdlTitle">添加持仓</h2>
    <div class="fg">
      <label class="fl">股票 / 证券代码</label>
      <input id="iSym" class="fi" placeholder="如: AAPL  /  600519.SS  /  0700.HK" oninput="this.value=this.value.toUpperCase()">
      <div class="fhint">沪A：600519.SS &nbsp;&middot;&nbsp; 深A：000858.SZ &nbsp;&middot;&nbsp; 港股：0700.HK &nbsp;&middot;&nbsp; 美股：AAPL</div>
    </div>
    <div class="frow">
      <div class="fg"><label class="fl">持股数量</label><input id="iShares" class="fi" type="number" placeholder="100" min="0" step="any"></div>
      <div class="fg"><label class="fl">买入均价（每股）</label><input id="iCost" class="fi" type="number" placeholder="150.00" min="0" step="any"></div>
    </div>
    <div class="fg"><label class="fl">备注（可选）</label><input id="iNote" class="fi" placeholder="如：第一批建仓"></div>
    <div class="ma">
      <button class="btn-sec" onclick="closeModal()">取消</button>
      <button class="btn-pri" onclick="savePos()">保存</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="conf-bg" id="confBg" style="display:none">
  <div class="conf">
    <strong id="confTitle">确认删除?</strong>
    <p id="confMsg">此操作不可撤销</p>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn-sec" onclick="closeConf()">取消</button>
      <button class="btn-pri" id="confOk" style="background:var(--red)">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
var portfolio = {accounts:[]};
var prices = {};
var editCtx = null;
var confCb = null;
var timer = null;
var cd = 30;
var INTERVAL = 30;

// ===== Boot =====
loadPF().then(function(){ return refreshPrices(); }).then(startTimer);

// ===== API =====
function loadPF(){
  return fetch('/api/portfolio').then(function(r){ return r.json(); }).then(function(d){ portfolio=d; }).catch(function(e){ toast('加载失败:'+e.message); });
}
function savePF(){
  return fetch('/api/portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(portfolio)}).catch(function(){ toast('保存失败'); });
}
function refreshPrices(){
  var syms=[];
  for(var i=0;i<portfolio.accounts.length;i++){
    var a=portfolio.accounts[i];
    for(var j=0;j<a.positions.length;j++){
      var sym=a.positions[j].symbol;
      if(sym && syms.indexOf(sym)===-1) syms.push(sym);
    }
  }
  if(!syms.length){ render(); return Promise.resolve(); }
  setLoading(true);
  return fetch('/api/prices?symbols='+syms.join(',')).then(function(r){ return r.json(); }).then(function(d){
    prices=d;
    document.getElementById('updTime').textContent='更新: '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
    render();
  }).catch(function(){ toast('行情获取失败'); render(); }).finally(function(){ setLoading(false); });
}

// ===== Timer =====
function startTimer(){
  if(timer) clearInterval(timer);
  cd=INTERVAL;
  timer=setInterval(function(){
    cd--;
    document.getElementById('pbar').style.width=((INTERVAL-cd)/INTERVAL*100)+'%';
    var b=document.getElementById('refBtn');
    if(!b.disabled) b.textContent='刷新('+cd+'s)';
    if(cd<=0){ cd=INTERVAL; refreshPrices(); }
  },1000);
}
function manualRefresh(){ cd=INTERVAL; document.getElementById('pbar').style.width='0%'; refreshPrices(); }
function setLoading(on){
  var b=document.getElementById('refBtn');
  b.disabled=on;
  if(on){ b.innerHTML='<span class="sp"></span>更新中'; }
  else { b.textContent='刷新('+cd+'s)'; }
}

// ===== Render =====
function render(){ renderSummary(); renderAccounts(); }

function renderSummary(){
  var cost=0,val=0,has=false;
  for(var i=0;i<portfolio.accounts.length;i++){
    var a=portfolio.accounts[i];
    for(var j=0;j<a.positions.length;j++){
      var p=a.positions[j], pr=prices[p.symbol];
      if(pr && pr.price!=null){ cost+=p.shares*p.cost; val+=p.shares*pr.price; has=true; }
    }
  }
  var pnl=val-cost, pct=cost?pnl/cost*100:0;
  var sv=document.getElementById('sTotalVal'),sp=document.getElementById('sTotalPnl'),sc=document.getElementById('sTotalPct');
  if(has){
    sv.textContent=fmtN(val); sv.className='sc-val';
    sp.textContent=(pnl>=0?'+':'')+fmtN(pnl); sp.className='sc-val '+(pnl>=0?'pos':'neg');
    sc.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%'; sc.className='sc-val '+(pct>=0?'pos':'neg');
  } else { sv.textContent=sp.textContent=sc.textContent='--'; sv.className=sp.className=sc.className='sc-val'; }
}

function renderAccounts(){
  var el=document.getElementById('accs');
  if(!portfolio.accounts.length){ el.innerHTML='<div class="empty">还没有账户，点击下方按钮新增</div>'; return; }
  el.innerHTML=portfolio.accounts.map(buildAcc).join('');
}

function buildAcc(acc){
  var cost=0,val=0,has=false;
  var rows=acc.positions.map(function(pos){
    var pr=prices[pos.symbol];
    var priceTxt='<span style="color:var(--text2);font-size:12px">加载中&hellip;</span>';
    var valTxt='--',pnlTxt='--',pctTxt='--',cls='neu',cs='';
    if(pr){
      cs=cSym(pr.currency);
      if(pr.error){
        priceTxt='<span class="err-price" title="'+esc(pr.error)+'">获取失败 &#9888;</span>';
      } else {
        has=true;
        var v=pos.shares*pr.price, c=pos.shares*pos.cost, pnl=v-c, pct=c?pnl/c*100:0;
        cost+=c; val+=v; cls=pnl>=0?'pos':'neg';
        priceTxt='<span>'+cs+fmtN(pr.price)+'</span><span class="price-chg '+(pr.changePct>=0?'pos':'neg')+'">'+(pr.changePct>=0?'&#9650;':'&#9660;')+Math.abs(pr.changePct).toFixed(2)+'%今日</span>';
        valTxt=cs+fmtN(v); pnlTxt=(pnl>=0?'+':'')+cs+fmtN(pnl); pctTxt=(pct>=0?'+':'')+pct.toFixed(2)+'%';
      }
    }
    var aid=acc.id, pid=pos.id, psym=esc(pos.symbol);
    var dr='<tr>'
      +'<td><div class="sym-cell"><span class="sym">'+esc(pos.symbol)+'</span><span class="sname">'+esc((pr&&pr.name)||pos.note||'')+'</span></div></td>'
      +'<td>'+fmtN(pos.shares,true)+'</td>'
      +'<td>'+cs+fmtN(pos.cost)+'</td>'
      +'<td><div style="display:flex;flex-direction:column;align-items:flex-end">'+priceTxt+'</div></td>'
      +'<td>'+valTxt+'</td>'
      +'<td class="'+cls+'">'+pnlTxt+'</td>'
      +'<td class="'+cls+'">'+pctTxt+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="ico-btn" onclick="editPos(\''+aid+'\',\''+pid+'\')" title="编辑">&#9999;&#65039;</button> '
      +'<button class="ico-btn del" onclick="askDelPos(\''+aid+'\',\''+pid+'\',\''+psym+'\')" title="删除">&#128465;&#65039;</button>'
      +'</td></tr>';
    var mc='<div class="pcard">'
      +'<div class="pcard-hdr">'
      +'<div><div style="font-weight:700;font-size:15px">'+esc(pos.symbol)+'</div>'
      +'<div style="color:var(--text2);font-size:11px;margin-top:2px">'+esc((pr&&pr.name)||pos.note||'')+'</div></div>'
      +'<div>'
      +'<button class="ico-btn" onclick="editPos(\''+aid+'\',\''+pid+'\')">&#9999;&#65039;</button> '
      +'<button class="ico-btn del" onclick="askDelPos(\''+aid+'\',\''+pid+'\',\''+psym+'\')">&#128465;&#65039;</button>'
      +'</div></div>'
      +'<div class="pf"><span class="pfl">持股数量</span><span class="pfv">'+fmtN(pos.shares,true)+'</span></div>'
      +'<div class="pf"><span class="pfl">买入均价</span><span class="pfv">'+cs+fmtN(pos.cost)+'</span></div>'
      +'<div class="pf"><span class="pfl">现价</span><span class="pfv">'+(pr&&pr.price!=null?cs+fmtN(pr.price):'--')+'</span></div>'
      +'<div class="pf"><span class="pfl">市值</span><span class="pfv">'+valTxt+'</span></div>'
      +'<div class="pf"><span class="pfl">盈亏金额</span><span class="pfv '+cls+'">'+pnlTxt+'</span></div>'
      +'<div class="pf"><span class="pfl">盈亏比例</span><span class="pfv '+cls+'">'+pctTxt+'</span></div>'
      +'</div>';
    return {dr:dr,mc:mc};
  });
  var pnl=val-cost, pct=cost?pnl/cost*100:0, cls=pnl>=0?'pos':'neg';
  var st=has
    ? '市值 <strong>'+fmtN(val)+'</strong> &nbsp; 盈亏 <strong class="'+cls+'">'+(pnl>=0?'+':'')+fmtN(pnl)+' ('+(pnl>=0?'+':'')+pct.toFixed(2)+'%)</strong>'
    : '（等待行情…）';
  var aid=acc.id, aname=esc(acc.name);
  var tblRows=rows.map(function(r){return r.dr;}).join('');
  var mobCards=rows.map(function(r){return r.mc;}).join('');
  return '<div class="acc">'
    +'<div class="acc-hdr">'
    +'<input class="acc-name" value="'+aname+'" title="点击编辑账户名" onchange="renameAcc(\''+aid+'\',this.value)" onclick="event.stopPropagation()">'
    +'<div class="acc-right"><span class="acc-summ">'+st+'</span>'
    +'<button class="ico-btn del" onclick="askDelAcc(\''+aid+'\',\''+aname+'\')" title="删除账户">&#128465;&#65039;</button>'
    +'</div></div>'
    +(acc.positions.length
      ? '<table class="tbl"><thead><tr><th>证券</th><th>持股数</th><th>买入均价</th><th>现价</th><th>市值</th><th>盈亏额</th><th>盈亏%</th><th></th></tr></thead><tbody>'+tblRows+'</tbody></table>'
        +'<div class="mob-pos">'+mobCards+'</div>'
      : '<div class="empty">暂无持仓，点击下方按钮添加</div>'
    )
    +'<div class="acc-ft"><button class="btn-add-pos" onclick="openAddPos(\''+aid+'\')">&#65291; 添加持仓</button></div>'
    +'</div>';
}

// ===== Account ops =====
function addAccount(){ portfolio.accounts.push({id:gid(),name:'账户'+(portfolio.accounts.length+1),positions:[]}); savePF(); render(); }
function renameAcc(id,name){ var a=portfolio.accounts.find(function(a){return a.id===id;}); if(a){a.name=name;savePF();} }
function askDelAcc(id,name){ showConf('删除账户','确定删除「'+name+'」及其所有持仓吗？',function(){delAcc(id);}); }
function delAcc(id){ portfolio.accounts=portfolio.accounts.filter(function(a){return a.id!==id;}); savePF(); render(); }

// ===== Position modal =====
function openAddPos(accId){
  editCtx={accId:accId,posId:null};
  document.getElementById('mdlTitle').textContent='添加持仓';
  ['iSym','iShares','iCost','iNote'].forEach(function(i){document.getElementById(i).value='';});
  document.getElementById('iSym').readOnly=false;
  document.getElementById('posMdl').style.display='flex';
  setTimeout(function(){document.getElementById('iSym').focus();},80);
}
function editPos(accId,posId){
  var acc=portfolio.accounts.find(function(a){return a.id===accId;}),pos=acc&&acc.positions.find(function(p){return p.id===posId;});
  if(!pos) return;
  editCtx={accId:accId,posId:posId};
  document.getElementById('mdlTitle').textContent='编辑持仓';
  document.getElementById('iSym').value=pos.symbol;
  document.getElementById('iShares').value=pos.shares;
  document.getElementById('iCost').value=pos.cost;
  document.getElementById('iNote').value=pos.note||'';
  document.getElementById('iSym').readOnly=true;
  document.getElementById('posMdl').style.display='flex';
  setTimeout(function(){document.getElementById('iShares').focus();},80);
}
function closeModal(){ document.getElementById('posMdl').style.display='none'; editCtx=null; }
function savePos(){
  var sym=document.getElementById('iSym').value.trim().toUpperCase();
  var shares=parseFloat(document.getElementById('iShares').value);
  var cost=parseFloat(document.getElementById('iCost').value);
  var note=document.getElementById('iNote').value.trim();
  if(!sym){toast('请输入股票代码');return;}
  if(!shares||shares<=0){toast('持股数量无效');return;}
  if(isNaN(cost)||cost<0){toast('成本价无效');return;}
  var accId=editCtx.accId, posId=editCtx.posId;
  var acc=portfolio.accounts.find(function(a){return a.id===accId;});
  if(!acc) return;
  if(posId){
    var pos=acc.positions.find(function(p){return p.id===posId;});
    if(pos){pos.shares=shares;pos.cost=cost;pos.note=note;}
  } else {
    if(acc.positions.find(function(p){return p.symbol===sym;})){toast('该账户已有此持仓，请编辑现有记录');return;}
    acc.positions.push({id:gid(),symbol:sym,shares:shares,cost:cost,note:note});
  }
  closeModal();
  savePF().then(function(){return refreshPrices();});
}
function askDelPos(accId,posId,sym){ showConf('删除持仓','确定删除 '+sym+' 的持仓吗？',function(){delPos(accId,posId);}); }
function delPos(accId,posId){
  var acc=portfolio.accounts.find(function(a){return a.id===accId;});
  if(acc){acc.positions=acc.positions.filter(function(p){return p.id!==posId;});savePF();render();}
}

// ===== Confirm =====
function showConf(title,msg,cb){
  document.getElementById('confTitle').textContent=title;
  document.getElementById('confMsg').textContent=msg;
  confCb=cb;
  document.getElementById('confOk').onclick=function(){closeConf();if(confCb)confCb();};
  document.getElementById('confBg').style.display='flex';
}
function closeConf(){ document.getElementById('confBg').style.display='none'; confCb=null; }

// ===== Utils =====
function gid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtN(n,isInt){
  if(n==null||isNaN(n)) return '--';
  if(isInt) return n.toLocaleString('zh-CN');
  if(Math.abs(n)>=10000) return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4});
}
function cSym(c){ return ({CNY:'¥',USD:'$',HKD:'HK$',EUR:'€',GBP:'£',JPY:'¥'})[c]||(c?c+' ':''); }
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0';},2500);
}
document.getElementById('posMdl').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal();});
document.getElementById('iCost').addEventListener('keydown',function(e){if(e.key==='Enter')savePos();});
document.getElementById('iNote').addEventListener('keydown',function(e){if(e.key==='Enter')savePos();});
</script>
