<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>我的持仓追踪</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#f85149;
  --blue:#58a6ff;--yellow:#d29922;--purple:#bc8cff;--accent:#1f6feb;--orange:#f0883e;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh}
#pbar{height:2px;background:var(--blue);position:fixed;top:0;left:0;z-index:9999;width:0%;transition:width .15s}
/* Header */
.hd{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hd-left{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#1f6feb,#58a6ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.hd-title{font-size:16px;font-weight:700}
.hd-sub{font-size:11px;color:var(--muted)}
.hd-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Month nav */
.month-nav{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:4px 10px}
.mnav-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 3px;transition:.1s}
.mnav-btn:hover{color:var(--text)}
.mnav-label{font-size:13px;font-weight:600;min-width:66px;text-align:center}
/* Buttons */
.btn{border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#388bfd}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-snap{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.btn-snap:hover{background:rgba(63,185,80,.22)}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-del{background:rgba(248,81,73,.12);color:var(--red);border:none}
.btn-del:hover{background:rgba(248,81,73,.22)}
/* Wrap */
.wrap{padding:16px 20px;max-width:1360px;margin:0 auto}
/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
.sc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.sc-val{font-size:18px;font-weight:700}
.sc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--blue)}
/* Update bar */
.upd-bar{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:7px 12px;font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.live{color:var(--green);font-weight:600}
.offline{color:var(--yellow)}
/* Theme filter */
.theme-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tpill{padding:4px 11px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s}
/* Section */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.sec-title::before{content:'';display:inline-block;width:3px;height:14px;background:var(--blue);border-radius:2px}
/* Holdings grid */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:18px}
.hcard{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px;transition:all .18s;position:relative;overflow:hidden}
.hcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.hcard.pos::before{background:var(--green)}
.hcard.neg::before{background:var(--red)}
.hcard.flat::before{background:var(--muted)}
.hcard:hover{border-color:var(--blue);transform:translateY(-1px)}
.hcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hcard-name{font-size:14px;font-weight:700}
.hcard-meta{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:11px;color:var(--muted)}
.ttag{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.hcard-r{text-align:right}
.hcard-pct{font-size:14px;font-weight:700}
.hcard-price{font-size:11px;color:var(--muted);margin-top:1px}
.hbar-wrap{background:var(--border);height:3px;border-radius:2px;margin:8px 0 6px}
.hbar{height:3px;border-radius:2px;background:var(--blue)}
.hcard-bot{display:flex;justify-content:space-between;align-items:center}
.hcard-detail{font-size:11px;color:var(--muted)}
.hcard-detail b{color:var(--text)}
.hcard-acts{display:flex;gap:3px;opacity:0;transition:.15s}
.hcard:hover .hcard-acts{opacity:1}
/* Charts */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
.cc.full{grid-column:1/-1}
.cc-title{font-size:13px;font-weight:600;margin-bottom:1px}
.cc-sub{font-size:11px;color:var(--muted);margin-bottom:8px}
/* Table */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px;margin-bottom:18px;overflow-x:auto}
.tbl-wrap h3{font-size:13px;font-weight:700;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
th{text-align:left;padding:6px 8px;color:var(--muted);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid rgba(48,54,61,.4);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(88,166,255,.025)}
.chg-p{color:var(--green);font-weight:600}
.chg-n{color:var(--red);font-weight:600}
/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:15px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
label{font-size:11px;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 10px;font-size:13px;width:100%;outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus{border-color:var(--accent)}
select option{background:var(--card2)}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text);margin-bottom:6px}
.empty p{font-size:12px;line-height:1.6;margin-bottom:16px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#21262d;border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13px;z-index:9999;transition:transform .25s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
/* Snapshot info */
.snap-info{font-size:11px;color:var(--muted);margin-top:4px}
@media(max-width:680px){
  .chart-row{grid-template-columns:1fr}
  .cc.full{grid-column:1}
  .stats{grid-template-columns:1fr 1fr}
  .frow{grid-template-columns:1fr}
  .hd{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div id="pbar"></div>

<div class="hd">
  <div class="hd-left">
    <div class="logo">我</div>
    <div>
      <div class="hd-title">我的持仓追踪</div>
      <div class="hd-sub" id="hdSub">个人账户 · 月度收益追踪</div>
    </div>
  </div>
  <div class="hd-right">
    <div class="month-nav">
      <button class="mnav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="mnav-label" id="monthLabel">—</span>
      <button class="mnav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <button class="btn btn-snap" onclick="saveSnapshot()">📌 记录快照</button>
    <button class="btn btn-primary" onclick="openAdd()">+ 添加持仓</button>
  </div>
</div>

<div class="wrap">
  <div class="upd-bar">
    <span>行情：<span id="quoteSrc" class="offline">○ 未获取</span> · 更新：<span id="updTime">—</span></span>
    <button class="btn btn-ghost btn-sm" onclick="doRefresh()">↻ 刷新行情</button>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="theme-bar" id="themeBar"></div>

  <div class="sec-hd">
    <div class="sec-title">持仓明细</div>
    <div style="font-size:12px;color:var(--muted)" id="holdMeta"></div>
  </div>
  <div class="hgrid" id="holdGrid"></div>

  <div class="chart-row" id="chartRow">
    <div class="cc">
      <div class="cc-title">题材分布</div>
      <div class="cc-sub">按市值占比</div>
      <div id="themeChart" style="height:260px"></div>
    </div>
    <div class="cc">
      <div class="cc-title">持仓盈亏</div>
      <div class="cc-sub">各股收益率（%）</div>
      <div id="pnlChart" style="height:260px"></div>
    </div>
    <div class="cc full">
      <div class="cc-title">月度收益走势</div>
      <div class="cc-sub">历史月收益率（点击"记录快照"后自动计算）</div>
      <div id="monthChart" style="height:200px"></div>
    </div>
  </div>

  <div class="tbl-wrap">
    <h3 id="tblTitle">持仓明细表</h3>
    <table>
      <thead>
        <tr>
          <th>#</th><th>名称</th><th>代码</th><th>题材</th>
          <th>持股</th><th>成本</th><th>现价</th>
          <th>浮盈亏</th><th>收益率</th><th>占比</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tblBody"></tbody>
    </table>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="overlay" id="posOverlay">
  <div class="modal">
    <h2 id="posTitle">添加持仓</h2>
    <div class="modal-sub" id="posSub"></div>
    <div class="frow">
      <div class="fg">
        <label>股票代码（A股6位）</label>
        <input id="f-code" placeholder="如：002463" maxlength="6" oninput="autoName()"/>
      </div>
      <div class="fg">
        <label>股票名称</label>
        <input id="f-name" placeholder="如：沪电股份"/>
      </div>
      <div class="fg full">
        <label>题材 / 主题</label>
        <select id="f-theme">
          <option value="PCB">PCB（印制电路板）</option>
          <option value="液冷">液冷</option>
          <option value="算力租赁/IDC">算力租赁 / IDC</option>
          <option value="光模块">光模块</option>
          <option value="AI芯片">AI 芯片 / 算力</option>
          <option value="半导体">半导体</option>
          <option value="消费电子">消费电子</option>
          <option value="新能源">新能源</option>
          <option value="金融">金融 / 银行</option>
          <option value="白酒">白酒 / 消费</option>
          <option value="医药">医药 / 生物</option>
          <option value="军工">军工</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="fg">
        <label>持股数量（股）</label>
        <input id="f-shares" type="number" placeholder="如：10000" min="1"/>
      </div>
      <div class="fg">
        <label>持仓成本价（元）</label>
        <input id="f-cost" type="number" placeholder="如：5.20" step="0.001" min="0.001"/>
      </div>
      <div class="fg full">
        <label>备注（选填）</label>
        <input id="f-note" placeholder="如：网格操作中 / T+0"/>
      </div>
    </div>
    <div class="mbtns">
      <button class="btn btn-ghost" onclick="closePosModal()">取消</button>
      <button class="btn btn-primary" onclick="savePos()">保存</button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="overlay" id="delOverlay">
  <div class="modal" style="max-width:320px">
    <h2>确认删除</h2>
    <div class="modal-sub" id="delMsg" style="margin-top:8px"></div>
    <div class="mbtns">
      <button class="btn btn-ghost" onclick="closeDelModal()">取消</button>
      <button class="btn btn-del" onclick="doDelete()">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── 题材配色 ───
const TC = {
  'PCB':'#58a6ff','液冷':'#3fb950','算力租赁/IDC':'#bc8cff',
  '光模块':'#f0883e','AI芯片':'#d29922','半导体':'#79c0ff',
  '消费电子':'#56d364','新能源':'#ffa657','金融':'#ff7b72',
  '白酒':'#e3b341','医药':'#63e6be','军工':'#f778a1','其他':'#8b949e'
};
const TB = {};
Object.keys(TC).forEach(k => TB[k] = TC[k].replace('#','') ?
  `rgba(${parseInt(TC[k].slice(1,3),16)},${parseInt(TC[k].slice(3,5),16)},${parseInt(TC[k].slice(5,7),16)},.14)` : 'rgba(139,148,158,.14)');

// ─── 股票名称快速查表 ───
const CNAMES = {
  '002463':'沪电股份','002916':'鹏鼎控股','603228':'景旺电子','002436':'兴森科技',
  '688256':'寒武纪','300502':'新易盛','300308':'中际旭创','300394':'天孚通信',
  '300570':'太辰光','603501':'韦尔股份','002371':'北方华创','688012':'中微公司',
  '688981':'中芯国际','600519':'贵州茅台','000858':'五粮液','002475':'立讯精密',
  '300750':'宁德时代','600036':'招商银行','601398':'工商银行','601318':'中国平安',
  '300059':'东方财富','601888':'中国中免','603259':'药明康德','300760':'迈瑞医疗',
  '002415':'海康威视','601225':'陕西煤业','600438':'通威股份','002459':'晶澳科技',
  '601012':'隆基绿能','600276':'恒瑞医药','603986':'兆易创新','002241':'歌尔股份',
  '600938':'中国海油','688111':'金山办公','300532':'菲利华','002602':'世纪华通',
  '002236':'大华股份','688498':'源杰科技','300014':'亿纬锂能','002848':'高澜股份',
  '300765':'新诺威','002049':'紫光股份','688331':'荣昌生物','688390':'固德威',
  '601865':'福莱特','300118':'东方日升','300532':'菲利华','002558':'巨人网络',
};
const FALLBACK = {
  '002463':5.0,'002916':26,'603228':38,'002436':15,'688256':350,'300502':385,
  '300308':480,'300394':25,'300570':12,'603501':98,'002371':53,'688012':37,
  '688981':52,'600519':1520,'000858':152,'002475':42,'300750':265,'600036':48,
  '601398':6.5,'601318':62,'300059':6.1,'601888':44,'603259':72,'300760':242,
  '002415':9.5,'600438':13,'002459':9.5,'601012':10,'601865':6.4,'300014':15.6,
  '600276':52,'603986':89,'002241':13.6,'600938':16.8,'688111':298,'002602':5.8,
  '002236':18.2,'688498':58,'688390':60,'300118':4.9,'002558':14,'002848':12,
};

// ─── 状态 ───
let portfolio = {v:2, months:{}, snapshots:{}};
let qCache = {};
let qLoading = false;
let currentMonth = todayYM();
let activeTheme = 'all';
let editingId = null;
let deletingId = null;
let charts = {};

// ─── 工具函数 ───
function todayYM() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function ymLabel(ym) {
  const [y,m] = ym.split('-');
  return y + '年' + parseInt(m) + '月';
}
function addM(ym, n) {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function fmtMoney(v) {
  return '¥' + Math.abs(v).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// ─── 服务器 API ───
async function loadFromServer() {
  try {
    const r = await fetch('/api/portfolio');
    const d = await r.json();
    // 检测是否是新格式（v:2）还是旧格式
    if (d && d.v === 2) {
      portfolio = d;
    } else if (d && d.months) {
      portfolio = {...d, v:2};
    }
    // 旧格式（accounts）忽略，从头开始
  } catch(e) { toast('加载失败：' + e.message); }
}
async function saveToServer() {
  try {
    await fetch('/api/portfolio', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(portfolio)
    });
  } catch(e) { toast('保存失败：' + e.message); }
}

// ─── 行情 ───
function toTxSym(code) {
  if (code.startsWith('6') || code.startsWith('5')) return 'sh' + code;
  if (code.startsWith('8') || code.startsWith('9') || code.startsWith('4')) return 'bj' + code;
  return 'sz' + code;
}
async function fetchLive(codes) {
  if (!codes.length) return {};
  const syms = codes.map(toTxSym).join(',');
  try {
    const r = await fetch('https://qt.gtimg.cn/q=' + syms, {cache:'no-store'});
    const txt = await r.text();
    const res = {};
    txt.split('\n').forEach(line => {
      const m = line.match(/v_([a-z]{2})(\d+)="([^"]+)"/);
      if (!m) return;
      const parts = m[3].split('~');
      if (parts.length < 5) return;
      const price = parseFloat(parts[3]), close = parseFloat(parts[4]);
      const chg = close > 0 ? +((price-close)/close*100).toFixed(2) : 0;
      if (price > 0) res[m[2]] = {price, chg, src:'live'};
    });
    return res;
  } catch { return {}; }
}
async function doRefresh() {
  if (qLoading) return;
  qLoading = true;
  progress(30);
  document.getElementById('quoteSrc').textContent = '⏳ 获取中…';
  document.getElementById('quoteSrc').className = 'offline';
  try {
    const allCodes = new Set();
    Object.values(portfolio.months||{}).forEach(md => (md.positions||[]).forEach(p => allCodes.add(p.code)));
    const codes = [...allCodes].filter(Boolean);
    if (codes.length) {
      const live = await fetchLive(codes);
      progress(80);
      codes.forEach(c => {
        qCache[c] = live[c] || {price: FALLBACK[c]||50, chg:0, src:'fallback'};
      });
      const isLive = Object.values(qCache).some(q => q.src === 'live');
      const el = document.getElementById('quoteSrc');
      el.textContent = isLive ? '● 实时行情' : '○ 离线备用';
      el.className = isLive ? 'live' : 'offline';
      const now = new Date();
      document.getElementById('updTime').textContent =
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
  } catch {}
  qLoading = false;
  progress(100);
  render();
  setTimeout(() => progress(0), 400);
}
function getQ(code) {
  return qCache[code] || {price: FALLBACK[code]||50, chg:0, src:'fallback'};
}

// ─── 进度条 ───
function progress(pct) {
  const el = document.getElementById('pbar');
  el.style.width = pct + '%';
  if (pct >= 100) setTimeout(() => { el.style.width = '0%'; }, 350);
}

// ─── Toast ───
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── 快照 ───
function saveSnapshot() {
  const md = getMonthData(currentMonth);
  if (!(md.positions||[]).length) { toast('当前月份没有持仓数据'); return; }
  const totalVal = md.positions.reduce((s,p) => s + getQ(p.code).price * p.shares, 0);
  if (!portfolio.snapshots) portfolio.snapshots = {};
  portfolio.snapshots[currentMonth] = {
    value: totalVal,
    date: new Date().toLocaleDateString('zh-CN')
  };
  saveToServer().then(() => { toast(`已记录 ${ymLabel(currentMonth)} 快照，市值 ${fmtMoney(totalVal)}`); render(); });
}

// ─── 月份导航 ───
function changeMonth(n) {
  currentMonth = addM(currentMonth, n);
  activeTheme = 'all';
  render();
}

// ─── 数据访问 ───
function getMonthData(ym) {
  if (!portfolio.months) portfolio.months = {};
  if (!portfolio.months[ym]) portfolio.months[ym] = {positions:[]};
  return portfolio.months[ym];
}

// ─── 月度收益计算 ───
function monthlyReturn(ym) {
  const prev = addM(ym, -1);
  const snaps = portfolio.snapshots || {};
  if (!snaps[prev]) return null;
  const prevVal = snaps[prev].value;
  let curVal;
  if (snaps[ym]) {
    curVal = snaps[ym].value;
  } else {
    // 用实时估算
    const md = getMonthData(ym);
    if (!(md.positions||[]).length) return null;
    curVal = md.positions.reduce((s,p) => s + getQ(p.code).price * p.shares, 0);
  }
  return (curVal - prevVal) / prevVal * 100;
}

// ─── 渲染入口 ───
function render() {
  document.getElementById('monthLabel').textContent = ymLabel(currentMonth);
  document.getElementById('hdSub').textContent = ymLabel(currentMonth) + ' · 月度收益追踪';
  document.getElementById('tblTitle').textContent = '持仓明细 · ' + ymLabel(currentMonth);

  const md = getMonthData(currentMonth);
  const positions = md.positions || [];
  const snaps = portfolio.snapshots || {};

  // 丰富数据
  let totalCost = 0, totalVal = 0;
  const enriched = positions.map(p => {
    const q = getQ(p.code);
    const cost = p.avgCost * p.shares;
    const val  = q.price * p.shares;
    const pnl  = val - cost;
    const pnlPct = cost > 0 ? pnl/cost*100 : 0;
    totalCost += cost; totalVal += val;
    return {...p, ...q, cost, val, pnl, pnlPct};
  });
  const totalPnl = totalVal - totalCost;
  const totalPnlPct = totalCost > 0 ? totalPnl/totalCost*100 : 0;

  // 月收益
  const mRet = monthlyReturn(currentMonth);

  // Stats
  renderStats(totalVal, totalCost, totalPnl, totalPnlPct, mRet, positions.length, snaps[currentMonth]);
  renderThemeBar(enriched);
  renderGrid(enriched, totalVal);
  renderTable(enriched, totalVal);
  try { renderCharts(enriched, totalVal); } catch(e) { console.warn('图表渲染失败:', e); }
}

function renderStats(totalVal, totalCost, totalPnl, totalPnlPct, mRet, count, snap) {
  const makeCard = (lbl, val, cls, sub) =>
    `<div class="sc"><div class="sc-lbl">${lbl}</div><div class="sc-val ${cls}">${val}</div><div class="sc-sub">${sub}</div></div>`;
  const pSign = v => v >= 0 ? '+' : '';
  document.getElementById('statsRow').innerHTML =
    makeCard('持仓市值', fmtMoney(totalVal), 'neu', `${count} 支股票`) +
    makeCard('持仓成本', fmtMoney(totalCost), 'neu', '总买入成本') +
    makeCard('浮动盈亏', (totalPnl>=0?'+':'')+fmtMoney(totalPnl), totalPnl>=0?'pos':'neg', '未实现盈亏') +
    makeCard('总收益率', pSign(totalPnlPct)+totalPnlPct.toFixed(2)+'%', totalPnlPct>=0?'pos':'neg', '相对成本') +
    makeCard('月度收益', mRet!==null ? pSign(mRet)+mRet.toFixed(2)+'%' : '—',
      mRet!==null ? (mRet>=0?'pos':'neg') : 'neu',
      snap ? '已记录快照' : (mRet!==null ? '实时估算' : '需记录上月快照')) +
    makeCard('持仓支数', String(count), 'neu', ymLabel(currentMonth));
}

function renderThemeBar(enriched) {
  const themes = ['all', ...new Set(enriched.map(p=>p.theme).filter(Boolean))];
  document.getElementById('themeBar').innerHTML = themes.map(t => {
    const color = t==='all' ? 'var(--blue)' : TC[t]||'var(--muted)';
    const bg    = t==='all' ? 'rgba(88,166,255,.12)' : TB[t]||'rgba(139,148,158,.12)';
    const label = t==='all' ? '全部' : t;
    const cnt   = t==='all' ? enriched.length : enriched.filter(p=>p.theme===t).length;
    const active = activeTheme === t;
    return `<span class="tpill" style="color:${color};background:${bg};border-color:${active?color:'transparent'};${active?'box-shadow:0 0 0 1px '+color+';':''}" onclick="setTheme('${t}')">${label} (${cnt})</span>`;
  }).join('');
}
function setTheme(t) { activeTheme = t; render(); }

function renderGrid(enriched, totalVal) {
  const list = activeTheme==='all' ? enriched : enriched.filter(p=>p.theme===activeTheme);
  document.getElementById('holdMeta').textContent = list.length + ' 支 · ' + ymLabel(currentMonth);
  const grid = document.getElementById('holdGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><h3>${activeTheme==='all'?'还没有持仓':'没有此题材的持仓'}</h3><p>${activeTheme==='all'?'点击右上角「添加持仓」开始记录':'切换题材或添加新持仓'}</p>${activeTheme==='all'?'<button class="btn btn-primary" onclick="openAdd()">+ 添加第一笔持仓</button>':''}</div>`;
    return;
  }
  const maxV = Math.max(...list.map(p=>p.val));
  grid.innerHTML = list.map(p => {
    const cls = p.pnl>0?'pos':p.pnl<0?'neg':'flat';
    const tC = TC[p.theme]||'var(--muted)', tB = TB[p.theme]||'rgba(139,148,158,.12)';
    const pct = (p.pnlPct>=0?'+':'')+p.pnlPct.toFixed(2)+'%';
    const pnlStr = (p.pnl>=0?'+':'')+fmtMoney(p.pnl);
    const dot = p.src==='live'?`<span style="color:var(--green);font-size:8px">●</span>`:`<span style="color:var(--muted);font-size:8px">○</span>`;
    const barW = maxV>0 ? (p.val/maxV*100).toFixed(1) : 0;
    return `<div class="hcard ${cls}">
      <div class="hcard-top">
        <div>
          <div class="hcard-name">${p.name} ${dot}</div>
          <div class="hcard-meta">${p.code} <span class="ttag" style="color:${tC};background:${tB}">${p.theme||'—'}</span></div>
        </div>
        <div class="hcard-r">
          <div class="hcard-pct ${cls}">${pct}</div>
          <div class="hcard-price">¥${p.price} · ${pnlStr}</div>
        </div>
      </div>
      <div class="hbar-wrap"><div class="hbar" style="width:${barW}%"></div></div>
      <div class="hcard-bot">
        <div class="hcard-detail"><b>${p.shares.toLocaleString()}</b>股 · 成本<b>¥${p.avgCost}</b>${p.note?` · ${p.note}`:''}</div>
        <div class="hcard-acts">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${p.id}')">编辑</button>
          <button class="btn btn-del btn-sm" onclick="askDel('${p.id}')">删</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderTable(enriched, totalVal) {
  const list = activeTheme==='all' ? enriched : enriched.filter(p=>p.theme===activeTheme);
  const tb = document.getElementById('tblBody');
  if (!list.length) { tb.innerHTML='<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:20px">无持仓数据</td></tr>'; return; }
  tb.innerHTML = list.map((p,i) => {
    const tC = TC[p.theme]||'var(--muted)', tB = TB[p.theme]||'rgba(139,148,158,.12)';
    const wtPct = totalVal>0 ? (p.val/totalVal*100).toFixed(1) : '0.0';
    const dot = p.src==='live'?`<span style="color:var(--green);font-size:9px">●</span>`:`<span style="color:var(--muted);font-size:9px">○</span>`;
    return `<tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td><b>${p.name}</b>${p.note?`<br><span style="font-size:10px;color:var(--muted)">${p.note}</span>`:''}</td>
      <td style="color:var(--muted)">${p.code}</td>
      <td><span class="ttag" style="color:${tC};background:${tB}">${p.theme||'—'}</span></td>
      <td>${p.shares.toLocaleString()}</td>
      <td>¥${p.avgCost}</td>
      <td>¥${p.price} ${dot}</td>
      <td class="${p.pnl>=0?'chg-p':'chg-n'}">${p.pnl>=0?'+':''}${fmtMoney(p.pnl)}</td>
      <td class="${p.pnlPct>=0?'chg-p':'chg-n'}">${p.pnlPct>=0?'+':''}${p.pnlPct.toFixed(2)}%</td>
      <td style="color:var(--muted)">${wtPct}%</td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="openEdit('${p.id}')">编辑</button>
        <button class="btn btn-del btn-sm" style="margin-left:3px" onclick="askDel('${p.id}')">删除</button>
      </td>
    </tr>`;
  }).join('');
}

function renderCharts(enriched, totalVal) {
  // Theme pie
  const themeEl = document.getElementById('themeChart');
  if (themeEl) {
    if (charts.theme) charts.theme.dispose();
    charts.theme = echarts.init(themeEl, 'dark');
    const themeMap = {};
    enriched.forEach(p => { const t=p.theme||'其他'; themeMap[t]=(themeMap[t]||0)+p.val; });
    const pieData = Object.entries(themeMap).map(([name,val])=>({name,value:+val.toFixed(0),itemStyle:{color:TC[name]||'#8b949e'}}));
    charts.theme.setOption({
      backgroundColor:'#161b22',
      tooltip:{trigger:'item',formatter:'{b}: ¥{c} ({d}%)',backgroundColor:'#1c2128',borderColor:'#30363d',textStyle:{color:'#e6edf3',fontSize:12}},
      legend:{show:false},
      series:[{type:'pie',radius:['36%','68%'],itemStyle:{borderColor:'#161b22',borderWidth:2},
        label:{formatter:'{b}\n{d}%',fontSize:11,color:'#8b949e'},data:pieData}]
    });
    window.addEventListener('resize', ()=>charts.theme?.resize());
  }

  // P&L bar
  const pnlEl = document.getElementById('pnlChart');
  if (pnlEl) {
    if (charts.pnl) charts.pnl.dispose();
    charts.pnl = echarts.init(pnlEl, 'dark');
    const sorted = [...enriched].sort((a,b)=>b.pnlPct-a.pnlPct);
    charts.pnl.setOption({
      backgroundColor:'#161b22',
      tooltip:{trigger:'axis',backgroundColor:'#1c2128',borderColor:'#30363d',textStyle:{color:'#e6edf3',fontSize:12}},
      grid:{left:70,right:55,top:6,bottom:26},
      xAxis:{axisLabel:{color:'#8b949e',fontSize:10,formatter:v=>v+'%'},splitLine:{lineStyle:{color:'#21262d'}}},
      yAxis:{type:'category',data:sorted.map(p=>p.name),axisLabel:{color:'#8b949e',fontSize:11}},
      series:[{type:'bar',
        data:sorted.map(p=>({value:+p.pnlPct.toFixed(2),itemStyle:{color:p.pnlPct>=0?'#3fb950':'#f85149'}})),
        label:{show:true,position:'right',formatter:p=>(p.value>=0?'+':'')+p.value+'%',fontSize:10,color:'#e6edf3'},
        barMaxWidth:14}]
    });
    window.addEventListener('resize', ()=>charts.pnl?.resize());
  }

  // Monthly chart
  const mEl = document.getElementById('monthChart');
  if (mEl) {
    if (charts.month) charts.month.dispose();
    charts.month = echarts.init(mEl, 'dark');
    const months = [];
    for (let i=11;i>=0;i--) months.push(addM(currentMonth,-i));
    const snaps = portfolio.snapshots || {};
    const retData = months.map((ym,idx)=>{
      if (idx===0) return null;
      const prev = months[idx-1];
      if (!snaps[ym]||!snaps[prev]) return null;
      return +((snaps[ym].value-snaps[prev].value)/snaps[prev].value*100).toFixed(2);
    });
    charts.month.setOption({
      backgroundColor:'#161b22',
      tooltip:{trigger:'axis',formatter:p=>{const v=p[0].value;return p[0].axisValue+'<br>'+(v!==null?(v>=0?'+':'')+v+'%':'无快照数据');},backgroundColor:'#1c2128',borderColor:'#30363d',textStyle:{color:'#e6edf3',fontSize:12}},
      grid:{left:46,right:14,top:14,bottom:26},
      xAxis:{data:months.map(m=>m.slice(5)+'月'),axisLabel:{color:'#8b949e',fontSize:10}},
      yAxis:{axisLabel:{color:'#8b949e',fontSize:10,formatter:v=>v+'%'},splitLine:{lineStyle:{color:'#21262d'}}},
      series:[{type:'bar',data:retData,
        itemStyle:{color:p=>p.value!==null?(p.value>=0?'#3fb950':'#f85149'):'#21262d'},
        label:{show:true,position:'top',formatter:p=>p.value!==null?(p.value>=0?'+':'')+p.value+'%':'',fontSize:10,color:'#e6edf3'},
        barMaxWidth:22}]
    });
    window.addEventListener('resize', ()=>charts.month?.resize());
  }
}

// ─── 添加/编辑 ───
function openAdd() {
  editingId = null;
  document.getElementById('posTitle').textContent = '添加持仓';
  document.getElementById('posSub').textContent = '添加到 ' + ymLabel(currentMonth);
  document.getElementById('f-code').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-theme').value = 'PCB';
  document.getElementById('f-shares').value = '';
  document.getElementById('f-cost').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('posOverlay').classList.add('show');
}
function openEdit(id) {
  const md = getMonthData(currentMonth);
  const p = (md.positions||[]).find(x=>x.id===id);
  if (!p) return;
  editingId = id;
  document.getElementById('posTitle').textContent = '编辑持仓';
  document.getElementById('posSub').textContent = p.name + ' · ' + ymLabel(currentMonth);
  document.getElementById('f-code').value = p.code;
  document.getElementById('f-name').value = p.name;
  document.getElementById('f-theme').value = p.theme || '其他';
  document.getElementById('f-shares').value = p.shares;
  document.getElementById('f-cost').value = p.avgCost;
  document.getElementById('f-note').value = p.note || '';
  document.getElementById('posOverlay').classList.add('show');
}
function closePosModal() { document.getElementById('posOverlay').classList.remove('show'); }

function autoName() {
  const code = document.getElementById('f-code').value.trim();
  const nameEl = document.getElementById('f-name');
  if (CNAMES[code] && !nameEl.value) nameEl.value = CNAMES[code];
}

async function savePos() {
  const code   = document.getElementById('f-code').value.trim();
  const name   = document.getElementById('f-name').value.trim();
  const theme  = document.getElementById('f-theme').value;
  const shares = parseInt(document.getElementById('f-shares').value);
  const cost   = parseFloat(document.getElementById('f-cost').value);
  const note   = document.getElementById('f-note').value.trim();
  if (!code || !name) { toast('请填写股票代码和名称'); return; }
  if (!shares || shares <= 0) { toast('持股数量无效'); return; }
  if (!cost || cost <= 0) { toast('成本价无效'); return; }

  const md = getMonthData(currentMonth);
  if (!md.positions) md.positions = [];
  if (editingId) {
    const idx = md.positions.findIndex(p=>p.id===editingId);
    if (idx>=0) md.positions[idx] = {...md.positions[idx], code, name, theme, shares, avgCost:cost, note};
  } else {
    md.positions.push({id:uid(), code, name, theme, shares, avgCost:cost, note});
  }
  closePosModal();
  await saveToServer();
  // Fetch quote for new stock
  if (!qCache[code]) {
    fetchLive([code]).then(r=>{ if(r[code]){qCache[code]={...r[code],src:'live'}; render();} });
  }
  toast(editingId ? '已更新' : '已添加');
  render();
}

// ─── 删除 ───
function askDel(id) {
  const md = getMonthData(currentMonth);
  const p = (md.positions||[]).find(x=>x.id===id);
  const name = p ? p.name : '该持仓';
  deletingId = id;
  document.getElementById('delMsg').textContent = `确定要删除「${name}」的 ${ymLabel(currentMonth)} 持仓记录？`;
  document.getElementById('delOverlay').classList.add('show');
}
function closeDelModal() { deletingId=null; document.getElementById('delOverlay').classList.remove('show'); }
async function doDelete() {
  if (!deletingId) return;
  const md = getMonthData(currentMonth);
  md.positions = (md.positions||[]).filter(p=>p.id!==deletingId);
  closeDelModal();
  await saveToServer();
  toast('已删除');
  render();
}

// ─── 初始化 ───
async function init() {
  progress(20);
  await loadFromServer();
  progress(60);
  render();
  await doRefresh();
  progress(100);
}
init();
setInterval(doRefresh, 10 * 60 * 1000);
</script>
