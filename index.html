<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>持仓损益</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--surf:#161b22;--card:#21262d;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;
  --green:#3fb950;--red:#f85149;--blue:#58a6ff;--gold:#d29922;
  --purple:#a371f7;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
#pbar{height:2px;background:var(--blue);position:fixed;top:0;left:0;z-index:9999;transition:width .1s linear;width:0%}
.hdr{background:var(--surf);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:16px;font-weight:700;color:var(--blue)}
.hdr-right{display:flex;align-items:center;gap:8px}
.upd-time{color:var(--text2);font-size:11px}
.btn-ref{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;min-width:80px}
.btn-ref:disabled{opacity:.6;cursor:default}
/* 4-card summary */
.summ{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:600px){.summ{grid-template-columns:repeat(2,1fr)}}
.sc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.sc-lbl{color:var(--text2);font-size:10px;margin-bottom:3px}
.sc-val{font-size:15px;font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--text2)}.pur{color:var(--purple)}
/* content */
.content{padding:12px;max-width:1300px;margin:0 auto}
/* account */
.acc{background:var(--surf);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.acc-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card);flex-wrap:wrap;gap:6px}
.acc-name{background:transparent;border:none;color:var(--text);font-size:14px;font-weight:700;outline:none;max-width:180px}
.acc-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acc-summ{font-size:11px;color:var(--text2)}
.ico-btn{background:var(--surf);border:1px solid var(--border);color:var(--text2);height:26px;padding:0 8px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap}
.ico-btn:hover{background:var(--card);color:var(--text)}
.ico-btn.del:hover{background:#2d1b1b;color:var(--red);border-color:var(--red)}
.ico-btn.buy{color:var(--green);border-color:#1f4c2a}
.ico-btn.buy:hover{background:#0d2e16}
.ico-btn.sell{color:var(--red);border-color:#4c1f1f}
.ico-btn.sell:hover{background:#2e0d0d}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#0a0d14;color:var(--text2);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 10px;border-top:1px solid var(--border);text-align:right;white-space:nowrap;vertical-align:middle}
.tbl td:first-child{text-align:left}
.tbl tr:hover{background:rgba(255,255,255,.02)}
.sym-cell{display:flex;flex-direction:column;gap:1px}
.sym{font-weight:700;font-size:13px}
.sname{color:var(--text2);font-size:10px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.price-chg{font-size:10px;display:block}
.err-price{color:var(--gold);font-size:10px}
/* footer */
.acc-ft{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.btn-add-pos{background:transparent;border:1px dashed var(--border);color:var(--text2);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px}
.btn-add-pos:hover{border-color:var(--green);color:var(--green)}
/* mobile cards */
@media(max-width:700px){
  .tbl{display:none}.mob-pos{display:block}
  .pcard{border-top:1px solid var(--border);padding:10px 12px}
  .pcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .pcard-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .pf{display:flex;flex-direction:column;gap:1px}
  .pfl{font-size:10px;color:var(--text2)}
  .pfv{font-size:13px;font-weight:600}
  .pcard-acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
}
@media(min-width:701px){.mob-pos{display:none}}
/* add account */
.btn-add-acc{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:transparent;border:2px dashed var(--border);border-radius:10px;color:var(--text2);font-size:13px;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-add-acc:hover{border-color:var(--blue);color:var(--blue)}
/* modal base */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.fg{margin-bottom:12px}
.fl{display:block;color:var(--text2);font-size:11px;margin-bottom:4px}
.fi{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:14px;outline:none}
.fi:focus{border-color:var(--blue)}
.fhint{color:var(--text2);font-size:10px;margin-top:3px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-pri{background:var(--blue);color:#fff;border:none;padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.btn-pri.green{background:#1a6b2a}
.btn-pri.red{background:#6b1a1a}
.btn-sec{background:var(--card);color:var(--text);border:1px solid var(--border);padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px}
/* trade type toggle */
.type-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:12px}
.type-btn{flex:1;padding:7px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;background:var(--card);border:none;color:var(--text2)}
.type-btn.active-buy{background:#0d2e16;color:var(--green)}
.type-btn.active-sell{background:#2e0d0d;color:var(--red)}
/* history modal */
.hist-modal{max-width:520px}
.hist-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.hs{background:var(--card);border-radius:6px;padding:8px 10px}
.hs-lbl{color:var(--text2);font-size:10px;margin-bottom:2px}
.hs-val{font-size:14px;font-weight:700}
.trade-list{max-height:300px;overflow-y:auto}
.trade-row{display:grid;grid-template-columns:80px 50px 70px 80px 90px 26px 26px;gap:4px;padding:7px 8px;border-top:1px solid var(--border);align-items:center;font-size:12px}
.trade-row:first-child{border-top:none}
.trade-hdr{color:var(--text2);font-size:10px;font-weight:500;border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:0;display:grid;grid-template-columns:80px 50px 70px 80px 90px 26px 26px;gap:4px;padding:5px 8px}
.trade-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;text-align:center}
.trade-del:hover{color:var(--red)}
.trade-edit{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;text-align:center}
.trade-edit:hover{color:var(--blue)}
/* confirm */
.conf-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px}
.conf{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:300px;width:100%;text-align:center}
.conf p{color:var(--text2);margin:6px 0 14px;font-size:12px}
/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:3px}
.empty{padding:24px;text-align:center;color:var(--text2);font-size:12px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="pbar"></div>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">&#128200; 持仓损益追踪器</div>
      <div class="hdr-right">
        <span class="upd-time" id="updTime">--</span>
        <button class="btn-ref" id="refBtn" onclick="manualRefresh()">刷新行情</button>
      </div>
    </div>
    <div class="summ">
      <div class="sc"><div class="sc-lbl">总市值</div><div class="sc-val" id="sTotalVal">--</div></div>
      <div class="sc"><div class="sc-lbl">浮动盈亏</div><div class="sc-val" id="sTotalUnreal">--</div></div>
      <div class="sc"><div class="sc-lbl">已实现盈亏</div><div class="sc-val" id="sTotalReal">--</div></div>
      <div class="sc"><div class="sc-lbl">综合总收益</div><div class="sc-val" id="sTotalAll">--</div></div>
    </div>
  </div>
  <div class="content">
    <div id="accs"></div>
    <button class="btn-add-acc" onclick="addAccount()">&#65291; 新增账户</button>
  </div>
</div>

<!-- Add / Edit Position Modal -->
<div class="modal-bg" id="posMdl" style="display:none">
  <div class="modal">
    <h2 id="posMdlTitle">&#128200; 新增持仓（首次买入）</h2>
    <div class="fg">
      <label class="fl">股票 / 证券代码</label>
      <input id="iSym" class="fi" placeholder="如: AAPL / 600519.SS / 0700.HK" oninput="this.value=this.value.toUpperCase()">
      <div class="fhint">沪A：600519.SS &nbsp;·&nbsp; 深A：000858.SZ &nbsp;·&nbsp; 港股：0700.HK &nbsp;·&nbsp; 美股：AAPL</div>
    </div>
    <div id="posMdlBuyFields">
      <div class="frow">
        <div class="fg"><label class="fl">买入数量</label><input id="iShares" class="fi" type="number" placeholder="100" min="0" step="any"></div>
        <div class="fg"><label class="fl">买入价格（每股）</label><input id="iCost" class="fi" type="number" placeholder="150.00" min="0" step="any"></div>
      </div>
      <div class="fg"><label class="fl">交易日期</label><input id="iDate" class="fi" type="date"></div>
    </div>
    <div class="fg"><label class="fl">备注（可选）</label><input id="iNote" class="fi" placeholder="如：第一批"></div>
    <div class="ma">
      <button class="btn-sec" onclick="closeModal('posMdl')">取消</button>
      <button class="btn-pri green" id="posMdlSaveBtn" onclick="saveNewPos()">&#9650; 确认买入</button>
    </div>
  </div>
</div>

<!-- Buy/Sell Trade Modal -->
<div class="modal-bg" id="tradeMdl" style="display:none">
  <div class="modal">
    <h2 id="tradeMdlTitle">买入 / 卖出</h2>
    <div class="type-toggle">
      <button class="type-btn" id="typeBuy" onclick="setTradeType('buy')">&#9650; 买入</button>
      <button class="type-btn" id="typeSell" onclick="setTradeType('sell')">&#9660; 卖出</button>
    </div>
    <div class="frow">
      <div class="fg"><label class="fl">数量</label><input id="tShares" class="fi" type="number" placeholder="100" min="0" step="any"></div>
      <div class="fg"><label class="fl">价格（每股）</label><input id="tPrice" class="fi" type="number" placeholder="150.00" min="0" step="any"></div>
    </div>
    <div class="fg"><label class="fl">交易日期</label><input id="tDate" class="fi" type="date"></div>
    <div class="fg" id="tTotalWrap" style="background:var(--card);border-radius:6px;padding:8px 10px">
      <span style="color:var(--text2);font-size:11px">交易金额</span>
      <span id="tTotal" style="float:right;font-weight:700">--</span>
    </div>
    <div class="ma">
      <button class="btn-sec" onclick="closeModal('tradeMdl')">取消</button>
      <button class="btn-pri" id="tradeConfirmBtn" onclick="saveTrade()">确认</button>
    </div>
  </div>
</div>

<!-- Trade History Modal -->
<div class="modal-bg" id="histMdl" style="display:none">
  <div class="modal hist-modal">
    <h2>&#128203; 交易记录 — <span id="histSymbol"></span></h2>
    <div class="hist-summary" id="histSummary"></div>
    <div class="trade-hdr">
      <span>日期</span><span>操作</span><span style="text-align:right">数量</span>
      <span style="text-align:right">价格</span><span style="text-align:right">金额</span><span></span><span></span>
    </div>
    <div class="trade-list" id="tradeList"></div>
    <div class="ma" style="margin-top:10px">
      <button class="btn-sec" onclick="closeModal('histMdl')">关闭</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="conf-bg" id="confBg" style="display:none">
  <div class="conf">
    <strong id="confTitle"></strong>
    <p id="confMsg"></p>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn-sec" onclick="closeConf()">取消</button>
      <button class="btn-pri" id="confOk" style="background:var(--red)">确认删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
var portfolio={accounts:[]}, prices={};
var tradeCtx=null;    // {accId,posId,editId?}
var histCtx=null;     // {accId,posId}
var posCtx=null;      // accId for new position
var posEditCtx=null;  // {accId,posId} for edit, or null for new
var tradeEditMode=false;
var confCb=null;
var timer=null, cd=30;
var INTERVAL=30;

// ===== Boot =====
loadPF().then(function(){ return refreshPrices(); }).then(startTimer);

// ===== Data migration: old {shares,cost} → trades array =====
function migrate(data) {
  for (var i=0; i<(data.accounts||[]).length; i++) {
    var acc=data.accounts[i];
    for (var j=0; j<(acc.positions||[]).length; j++) {
      var pos=acc.positions[j];
      if (!pos.trades) {
        pos.trades=[];
        if (pos.shares && pos.cost) {
          pos.trades.push({id:gid(),type:'buy',
            shares:parseFloat(pos.shares),price:parseFloat(pos.cost),
            date:new Date().toISOString().slice(0,10)});
        }
        delete pos.shares; delete pos.cost;
      }
    }
  }
  return data;
}

// ===== Calculate position from trades (移动加权平均成本法) =====
function calcPos(trades) {
  var sorted=trades.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  var avgCost=0, shares=0, realizedPnl=0, totalBought=0, totalBoughtCost=0;
  for (var i=0; i<sorted.length; i++) {
    var t=sorted[i];
    if (t.type==='buy') {
      avgCost=(shares*avgCost + t.shares*t.price)/(shares+t.shares);
      shares+=t.shares;
      totalBought+=t.shares; totalBoughtCost+=t.shares*t.price;
    } else {
      realizedPnl+=t.shares*(t.price-avgCost);
      shares-=t.shares;
    }
  }
  return {
    shares: Math.round(shares*10000)/10000,
    avgCost: avgCost,
    realizedPnl: realizedPnl
  };
}

// ===== API =====
function loadPF(){
  return fetch('/api/portfolio').then(function(r){return r.json();}).then(function(d){
    portfolio=migrate(d);
  }).catch(function(e){toast('加载失败:'+e.message);});
}
function savePF(){
  return fetch('/api/portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(portfolio)}).catch(function(){toast('保存失败');});
}
function refreshPrices(){
  var syms=[];
  for(var i=0;i<portfolio.accounts.length;i++){
    var a=portfolio.accounts[i];
    for(var j=0;j<a.positions.length;j++){
      var sym=a.positions[j].symbol;
      if(sym&&syms.indexOf(sym)===-1)syms.push(sym);
    }
  }
  if(!syms.length){render();return Promise.resolve();}
  setLoading(true);
  return fetch('/api/prices?symbols='+syms.join(',')).then(function(r){return r.json();}).then(function(d){
    prices=d;
    document.getElementById('updTime').textContent='更新: '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
    render();
  }).catch(function(){toast('行情获取失败');render();}).finally(function(){setLoading(false);});
}

// ===== Timer =====
function startTimer(){
  if(timer)clearInterval(timer); cd=INTERVAL;
  timer=setInterval(function(){
    cd--;
    document.getElementById('pbar').style.width=((INTERVAL-cd)/INTERVAL*100)+'%';
    var b=document.getElementById('refBtn');
    if(!b.disabled)b.textContent='刷新('+cd+'s)';
    if(cd<=0){cd=INTERVAL;refreshPrices();}
  },1000);
}
function manualRefresh(){cd=INTERVAL;document.getElementById('pbar').style.width='0%';refreshPrices();}
function setLoading(on){
  var b=document.getElementById('refBtn');
  b.disabled=on;
  b.innerHTML=on?'<span class="sp"></span>更新中':'刷新('+cd+'s)';
}

// ===== Render =====
function render(){renderSummary();renderAccounts();}

function renderSummary(){
  var totalVal=0, totalUnreal=0, totalReal=0, has=false;
  for(var i=0;i<portfolio.accounts.length;i++){
    var a=portfolio.accounts[i];
    for(var j=0;j<a.positions.length;j++){
      var pos=a.positions[j];
      var calc=calcPos(pos.trades||[]);
      var pr=prices[pos.symbol];
      totalReal+=calc.realizedPnl;
      if(pr&&pr.price!=null&&calc.shares>0){
        var mv=calc.shares*pr.price;
        var unreal=calc.shares*(pr.price-calc.avgCost);
        totalVal+=mv; totalUnreal+=unreal; has=true;
      }
    }
  }
  var totalAll=totalUnreal+totalReal;
  function setCard(id,val,showSign){
    var el=document.getElementById(id);
    if(val===null){el.textContent='--';el.className='sc-val';return;}
    el.textContent=(showSign&&val>=0?'+':'')+fmtN(val);
    el.className='sc-val '+(val>0?'pos':val<0?'neg':'neu');
  }
  document.getElementById('sTotalVal').textContent=has?fmtN(totalVal):'--';
  document.getElementById('sTotalVal').className='sc-val';
  setCard('sTotalUnreal',has?totalUnreal:null,true);
  // Show realized even if no live prices
  var hasAny=portfolio.accounts.some(function(a){return a.positions.some(function(p){return (p.trades||[]).length>0;});});
  document.getElementById('sTotalReal').textContent=hasAny?((totalReal>=0?'+':'')+fmtN(totalReal)):'--';
  document.getElementById('sTotalReal').className='sc-val '+(totalReal>0?'pos':totalReal<0?'neg':'neu');
  setCard('sTotalAll',has?totalAll:null,true);
  document.getElementById('sTotalAll').className='sc-val pur';
  if(has&&totalAll!==0){
    document.getElementById('sTotalAll').className='sc-val '+(totalAll>0?'pos':totalAll<0?'neg':'neu');
  }
}

function renderAccounts(){
  var el=document.getElementById('accs');
  if(!portfolio.accounts.length){el.innerHTML='<div class="empty">还没有账户，点击下方按钮新增</div>';return;}
  el.innerHTML=portfolio.accounts.map(buildAcc).join('');
}

function buildAcc(acc){
  var accVal=0, accUnreal=0, accReal=0, hasPrice=false;
  var rows=acc.positions.map(function(pos){
    var calc=calcPos(pos.trades||[]);
    var pr=prices[pos.symbol];
    var cs=pr?cSym(pr.currency):'';
    var shares=calc.shares, avgCost=calc.avgCost, realPnl=calc.realizedPnl;
    accReal+=realPnl;

    // Price display
    var priceTxt='<span style="color:var(--text2);font-size:11px">加载中&hellip;</span>';
    var mvTxt='--', unrealTxt='--', totalTxt='--';
    var unrealCls='neu', totalCls='neu';

    if(pr){
      cs=cSym(pr.currency);
      if(pr.error){
        priceTxt='<span class="err-price" title="'+esc(pr.error)+'">获取失败&#9888;</span>';
      } else if(shares>0){
        hasPrice=true;
        var mv=shares*pr.price;
        var unreal=shares*(pr.price-avgCost);
        var total=unreal+realPnl;
        accVal+=mv; accUnreal+=unreal;
        unrealCls=unreal>=0?'pos':'neg';
        totalCls=total>=0?'pos':'neg';
        priceTxt='<span>'+cs+fmtN(pr.price)+'</span><span class="price-chg '+(pr.changePct>=0?'pos':'neg')+'">'+(pr.changePct>=0?'&#9650;':'&#9660;')+Math.abs(pr.changePct).toFixed(2)+'%</span>';
        mvTxt=cs+fmtN(mv);
        unrealTxt=(unreal>=0?'+':'')+cs+fmtN(unreal);
        totalTxt=(total>=0?'+':'')+cs+fmtN(total);
      } else {
        // Fully sold out
        priceTxt='<span style="color:var(--text2)">已清仓</span>';
        unrealTxt='--';
        var total=realPnl;
        totalCls=total>=0?'pos':'neg';
        totalTxt=(total>=0?'+':'')+cs+fmtN(total);
      }
    }

    var realCls=realPnl>=0?'pos':'neg';
    var aid=acc.id,pid=pos.id,psym=esc(pos.symbol);

    // Desktop row
    var dr='<tr>'
      +'<td><div class="sym-cell"><span class="sym">'+esc(pos.symbol)+'</span>'
      +'<span class="sname">'+esc((pr&&pr.name)||pos.note||'')+'</span></div></td>'
      +'<td>'+(shares>0?fmtN(shares,true):'<span style="color:var(--text2)">0</span>')+'</td>'
      +'<td>'+(avgCost>0?cs+fmtN(avgCost):'--')+'</td>'
      +'<td><div style="display:flex;flex-direction:column;align-items:flex-end">'+priceTxt+'</div></td>'
      +'<td>'+mvTxt+'</td>'
      +'<td class="'+unrealCls+'">'+unrealTxt+'</td>'
      +'<td class="'+realCls+'">'+(realPnl!==0?(realPnl>=0?'+':'')+cs+fmtN(realPnl):'--')+'</td>'
      +'<td class="'+totalCls+'">'+totalTxt+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="ico-btn buy" onclick="openTrade(\''+aid+'\',\''+pid+'\',\'buy\')">&#9650;买</button> '
      +(shares>0?'<button class="ico-btn sell" onclick="openTrade(\''+aid+'\',\''+pid+'\',\'sell\')">&#9660;卖</button> ':'')
      +'<button class="ico-btn" onclick="openHist(\''+aid+'\',\''+pid+'\')">&#128203;</button> '
      +'<button class="ico-btn" onclick="openEditPos(\''+aid+'\',\''+pid+'\')">&#9998;</button> '
      +'<button class="ico-btn del" onclick="askDelPos(\''+aid+'\',\''+pid+'\',\''+psym+'\')">&#10006;</button>'
      +'</td></tr>';

    // Mobile card
    var mc='<div class="pcard">'
      +'<div class="pcard-top">'
      +'<div><div style="font-weight:700;font-size:15px">'+esc(pos.symbol)+'</div>'
      +'<div style="color:var(--text2);font-size:11px">'+esc((pr&&pr.name)||pos.note||'')+'</div></div>'
      +'<div style="text-align:right"><div class="'+totalCls+'" style="font-size:16px;font-weight:700">'+totalTxt+'</div>'
      +'<div style="font-size:10px;color:var(--text2)">综合收益</div></div>'
      +'</div>'
      +'<div class="pcard-grid">'
      +'<div class="pf"><span class="pfl">持有数量</span><span class="pfv">'+(shares>0?fmtN(shares,true):'已清仓')+'</span></div>'
      +'<div class="pf"><span class="pfl">买入均价</span><span class="pfv">'+(avgCost>0?cs+fmtN(avgCost):'--')+'</span></div>'
      +'<div class="pf"><span class="pfl">现价</span><span class="pfv">'+(pr&&pr.price!=null?cs+fmtN(pr.price):'--')+'</span></div>'
      +'<div class="pf"><span class="pfl">市值</span><span class="pfv">'+mvTxt+'</span></div>'
      +'<div class="pf"><span class="pfl">浮动盈亏</span><span class="pfv '+unrealCls+'">'+unrealTxt+'</span></div>'
      +'<div class="pf"><span class="pfl">已实现盈亏</span><span class="pfv '+realCls+'">'+(realPnl!==0?(realPnl>=0?'+':'')+cs+fmtN(realPnl):'--')+'</span></div>'
      +'</div>'
      +'<div class="pcard-acts">'
      +'<button class="ico-btn buy" onclick="openTrade(\''+aid+'\',\''+pid+'\',\'buy\')">&#9650; 买入</button>'
      +(shares>0?'<button class="ico-btn sell" onclick="openTrade(\''+aid+'\',\''+pid+'\',\'sell\')">&#9660; 卖出</button>':'')
      +'<button class="ico-btn" onclick="openHist(\''+aid+'\',\''+pid+'\')">&#128203; 记录</button>'
      +'<button class="ico-btn" onclick="openEditPos(\''+aid+'\',\''+pid+'\')">&#9998; 编辑</button>'
      +'<button class="ico-btn del" onclick="askDelPos(\''+aid+'\',\''+pid+'\',\''+psym+'\')">&#10006; 删除</button>'
      +'</div></div>';
    return {dr:dr,mc:mc};
  });

  var accTotal=accUnreal+accReal;
  var accCls=accTotal>=0?'pos':'neg';
  var st=hasPrice
    ?'市值<strong> '+fmtN(accVal)+'</strong> &nbsp; 综合<strong class="'+accCls+'"> '+(accTotal>=0?'+':'')+fmtN(accTotal)+'</strong>'
    :'（等待行情…）';

  return '<div class="acc">'
    +'<div class="acc-hdr">'
    +'<input class="acc-name" value="'+esc(acc.name)+'" onchange="renameAcc(\''+acc.id+'\',this.value)" onclick="event.stopPropagation()" title="点击编辑">'
    +'<div class="acc-right"><span class="acc-summ">'+st+'</span>'
    +'<button class="ico-btn del" onclick="askDelAcc(\''+acc.id+'\',\''+esc(acc.name)+'\')">&#10006; 删除账户</button>'
    +'</div></div>'
    +(acc.positions.length
      ?'<table class="tbl"><thead><tr>'
        +'<th>证券</th><th>持有数</th><th>均价</th><th>现价</th>'
        +'<th>市值</th><th>浮动盈亏</th><th>已实现</th><th>综合收益</th><th></th>'
        +'</tr></thead><tbody>'+rows.map(function(r){return r.dr;}).join('')+'</tbody></table>'
        +'<div class="mob-pos">'+rows.map(function(r){return r.mc;}).join('')+'</div>'
      :'<div class="empty">暂无持仓</div>'
    )
    +'<div class="acc-ft">'
    +'<button class="btn-add-pos" onclick="openNewPos(\''+acc.id+'\')">&#9650; 新增持仓（买入新标的）</button>'
    +'</div></div>';
}

// ===== Account ops =====
function addAccount(){portfolio.accounts.push({id:gid(),name:'账户'+(portfolio.accounts.length+1),positions:[]});savePF();render();}
function renameAcc(id,name){var a=findAcc(id);if(a){a.name=name;savePF();}}
function askDelAcc(id,name){showConf('删除账户','确定删除「'+name+'」及所有持仓记录？',function(){portfolio.accounts=portfolio.accounts.filter(function(a){return a.id!==id;});savePF();render();});}

// ===== New position (first buy) =====
function openNewPos(accId){
  posCtx=accId; posEditCtx=null;
  document.getElementById('iSym').value='';
  document.getElementById('iShares').value='';
  document.getElementById('iCost').value='';
  document.getElementById('iNote').value='';
  document.getElementById('iDate').value=today();
  document.getElementById('iSym').readOnly=false;
  document.getElementById('posMdlTitle').innerHTML='&#128200; 新增持仓（首次买入）';
  document.getElementById('posMdlBuyFields').style.display='';
  document.getElementById('posMdlSaveBtn').innerHTML='&#9650; 确认买入';
  document.getElementById('posMdlSaveBtn').className='btn-pri green';
  document.getElementById('posMdl').style.display='flex';
  setTimeout(function(){document.getElementById('iSym').focus();},80);
}
function openEditPos(accId,posId){
  var pos=findPos(accId,posId); if(!pos)return;
  posCtx=accId; posEditCtx={accId:accId,posId:posId};
  document.getElementById('iSym').value=pos.symbol;
  document.getElementById('iNote').value=pos.note||'';
  document.getElementById('iSym').readOnly=false;
  document.getElementById('posMdlTitle').innerHTML='&#9998; 编辑持仓信息';
  document.getElementById('posMdlBuyFields').style.display='none';
  document.getElementById('posMdlSaveBtn').innerHTML='保存修改';
  document.getElementById('posMdlSaveBtn').className='btn-pri';
  document.getElementById('posMdl').style.display='flex';
  setTimeout(function(){document.getElementById('iSym').focus();},80);
}
function saveNewPos(){
  var sym=document.getElementById('iSym').value.trim().toUpperCase();
  var note=document.getElementById('iNote').value.trim();
  if(!sym){toast('请输入代码');return;}
  if(posEditCtx){
    // Edit mode: update symbol and note only
    var pos=findPos(posEditCtx.accId,posEditCtx.posId); if(!pos)return;
    var acc=findAcc(posEditCtx.accId);
    if(acc&&sym!==pos.symbol&&acc.positions.find(function(p){return p.symbol===sym&&p.id!==pos.id;})){toast('该账户已有此标的');return;}
    pos.symbol=sym; pos.note=note;
    closeModal('posMdl');
    savePF().then(function(){return refreshPrices();});
    return;
  }
  // New position mode
  var shares=parseFloat(document.getElementById('iShares').value);
  var price=parseFloat(document.getElementById('iCost').value);
  var date=document.getElementById('iDate').value||today();
  if(!shares||shares<=0){toast('数量无效');return;}
  if(!price||price<0){toast('价格无效');return;}
  var acc=findAcc(posCtx); if(!acc)return;
  if(acc.positions.find(function(p){return p.symbol===sym;})){toast('该账户已有此标的，请在持仓行点击「买入」');return;}
  acc.positions.push({id:gid(),symbol:sym,note:note,trades:[{id:gid(),type:'buy',shares:shares,price:price,date:date}]});
  closeModal('posMdl');
  savePF().then(function(){return refreshPrices();});
}

// ===== Buy/Sell trade =====
var currentTradeType='buy';
function openTrade(accId,posId,type){
  tradeCtx={accId:accId,posId:posId}; tradeEditMode=false;
  setTradeType(type);
  document.getElementById('tShares').value='';
  document.getElementById('tPrice').value='';
  document.getElementById('tDate').value=today();
  document.getElementById('tTotal').textContent='--';
  document.getElementById('tradeMdl').style.display='flex';
  setTimeout(function(){document.getElementById('tShares').focus();},80);
}
function openEditTrade(accId,posId,tradeId){
  var pos=findPos(accId,posId); if(!pos)return;
  var trade=pos.trades.find(function(t){return t.id===tradeId;}); if(!trade)return;
  tradeCtx={accId:accId,posId:posId,editId:tradeId}; tradeEditMode=true;
  setTradeType(trade.type);
  document.getElementById('tShares').value=trade.shares;
  document.getElementById('tPrice').value=trade.price;
  document.getElementById('tDate').value=trade.date;
  document.getElementById('tradeMdlTitle').textContent='编辑交易记录';
  document.getElementById('tradeConfirmBtn').innerHTML='保存修改';
  document.getElementById('tradeConfirmBtn').className='btn-pri';
  calcTradeTotal();
  document.getElementById('tradeMdl').style.display='flex';
}
function setTradeType(type){
  currentTradeType=type;
  var buy=document.getElementById('typeBuy');
  var sell=document.getElementById('typeSell');
  var btn=document.getElementById('tradeConfirmBtn');
  buy.className='type-btn'+(type==='buy'?' active-buy':'');
  sell.className='type-btn'+(type==='sell'?' active-sell':'');
  if(!tradeEditMode){
    if(type==='buy'){btn.className='btn-pri green';btn.innerHTML='&#9650; 确认买入';}
    else{btn.className='btn-pri red';btn.innerHTML='&#9660; 确认卖出';}
    document.getElementById('tradeMdlTitle').textContent=type==='buy'?'买入':'卖出';
  }
  calcTradeTotal();
}
function calcTradeTotal(){
  var s=parseFloat(document.getElementById('tShares').value);
  var p=parseFloat(document.getElementById('tPrice').value);
  if(s&&p){
    var total=s*p;
    document.getElementById('tTotal').textContent=(currentTradeType==='buy'?'-':'+')+(prices[tradeCtx&&(findPos(tradeCtx.accId,tradeCtx.posId)||{}).symbol]?cSym(prices[(findPos(tradeCtx.accId,tradeCtx.posId)||{}).symbol].currency):'¥')+fmtN(total);
  } else {
    document.getElementById('tTotal').textContent='--';
  }
}
function saveTrade(){
  if(!tradeCtx)return;
  var shares=parseFloat(document.getElementById('tShares').value);
  var price=parseFloat(document.getElementById('tPrice').value);
  var date=document.getElementById('tDate').value||today();
  if(!shares||shares<=0){toast('数量无效');return;}
  if(!price||price<0){toast('价格无效');return;}
  var pos=findPos(tradeCtx.accId,tradeCtx.posId); if(!pos)return;
  if(tradeCtx.editId){
    // Edit existing trade
    var trade=pos.trades.find(function(t){return t.id===tradeCtx.editId;});
    if(trade){trade.type=currentTradeType;trade.shares=shares;trade.price=price;trade.date=date;}
  } else {
    // Check sell doesn't exceed holdings
    if(currentTradeType==='sell'){
      var calc=calcPos(pos.trades);
      if(shares>calc.shares){toast('卖出数量超过持有数量 ('+fmtN(calc.shares,true)+')');return;}
    }
    pos.trades.push({id:gid(),type:currentTradeType,shares:shares,price:price,date:date});
  }
  tradeEditMode=false;
  closeModal('tradeMdl');
  savePF().then(function(){
    render();
    if(histCtx&&document.getElementById('histMdl').style.display!=='none')renderHist();
    return refreshPrices();
  });
}

// ===== Trade history =====
function openHist(accId,posId){
  histCtx={accId:accId,posId:posId};
  renderHist();
  document.getElementById('histMdl').style.display='flex';
}
function renderHist(){
  if(!histCtx)return;
  var pos=findPos(histCtx.accId,histCtx.posId);
  if(!pos)return;
  var pr=prices[pos.symbol];
  var cs=pr?cSym(pr.currency):'';
  var calc=calcPos(pos.trades||[]);
  document.getElementById('histSymbol').textContent=pos.symbol;
  // Summary
  var curPrice=pr&&pr.price!=null?pr.price:null;
  var unreal=curPrice&&calc.shares>0?calc.shares*(curPrice-calc.avgCost):null;
  var sumHtml='<div class="hs"><div class="hs-lbl">当前持有</div><div class="hs-val">'+fmtN(calc.shares,true)+' 股</div></div>'
    +'<div class="hs"><div class="hs-lbl">买入均价</div><div class="hs-val">'+(calc.avgCost>0?cs+fmtN(calc.avgCost):'--')+'</div></div>'
    +'<div class="hs"><div class="hs-lbl">已实现盈亏</div><div class="hs-val '+(calc.realizedPnl>=0?'pos':'neg')+'">'+(calc.realizedPnl!==0?(calc.realizedPnl>=0?'+':'')+cs+fmtN(calc.realizedPnl):'--')+'</div></div>';
  document.getElementById('histSummary').innerHTML=sumHtml;
  // Trades
  var sorted=(pos.trades||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!sorted.length){document.getElementById('tradeList').innerHTML='<div class="empty">暂无交易记录</div>';return;}
  var html=sorted.map(function(t){
    var total=t.shares*t.price;
    var isBuy=t.type==='buy';
    return '<div class="trade-row">'
      +'<span>'+t.date+'</span>'
      +'<span style="color:'+(isBuy?'var(--green)':'var(--red)')+';font-weight:600">'+(isBuy?'&#9650;买入':'&#9660;卖出')+'</span>'
      +'<span style="text-align:right">'+fmtN(t.shares,true)+'</span>'
      +'<span style="text-align:right">'+cs+fmtN(t.price)+'</span>'
      +'<span style="text-align:right;color:'+(isBuy?'var(--red)':'var(--green)')+'">'+( isBuy?'-':'+' )+cs+fmtN(total)+'</span>'
      +'<button class="trade-edit" onclick="openEditTrade(\''+histCtx.accId+'\',\''+histCtx.posId+'\',\''+t.id+'\')">&#9998;</button>'
      +'<button class="trade-del" onclick="askDelTrade(\''+histCtx.accId+'\',\''+histCtx.posId+'\',\''+t.id+'\')">&#10006;</button>'
      +'</div>';
  }).join('');
  document.getElementById('tradeList').innerHTML=html;
}
function askDelTrade(accId,posId,tradeId){
  showConf('删除记录','确定删除这条交易记录？',function(){
    var pos=findPos(accId,posId);
    if(pos){pos.trades=pos.trades.filter(function(t){return t.id!==tradeId;});savePF();render();renderHist();}
  });
}

// ===== Delete position =====
function askDelPos(accId,posId,sym){
  showConf('删除持仓','确定删除 '+sym+' 的所有持仓和交易记录？',function(){
    var acc=findAcc(accId);
    if(acc){acc.positions=acc.positions.filter(function(p){return p.id!==posId;});savePF();render();}
  });
}

// ===== Confirm dialog =====
function showConf(title,msg,cb){
  document.getElementById('confTitle').textContent=title;
  document.getElementById('confMsg').textContent=msg;
  confCb=cb;
  document.getElementById('confOk').onclick=function(){var fn=confCb;closeConf();if(fn)fn();};
  document.getElementById('confBg').style.display='flex';
}
function closeConf(){document.getElementById('confBg').style.display='none';confCb=null;}

// ===== Modal helpers =====
function closeModal(id){document.getElementById(id).style.display='none';}
['posMdl','tradeMdl','histMdl'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal(id);});
});

// ===== Auto-calc trade total on input =====
document.getElementById('tShares').addEventListener('input',calcTradeTotal);
document.getElementById('tPrice').addEventListener('input',calcTradeTotal);
['iCost','tPrice'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter'){id==='iCost'?saveNewPos():saveTrade();}});
});

// ===== Utils =====
function findAcc(id){return portfolio.accounts.find(function(a){return a.id===id;});}
function findPos(accId,posId){var a=findAcc(accId);return a&&a.positions.find(function(p){return p.id===posId;});}
function today(){return new Date().toISOString().slice(0,10);}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtN(n,isInt){
  if(n==null||isNaN(n))return'--';
  if(isInt)return Number(n).toLocaleString('zh-CN');
  if(Math.abs(n)>=10000)return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4});
}
function cSym(c){return({CNY:'¥',USD:'$',HKD:'HK$',EUR:'€',GBP:'£',JPY:'¥'})[c]||(c?c+' ':'');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2500);}
</script>
